<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>さくらんぼ ひきざん</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff8f3;
        --ink: #33241f;
        --ink-soft: #7a655c;
        --accent: #e0342b;
        --accent-dark: #b92318;
        --accent-soft: #ffe3de;
        --green: #2f9e4f;
        --green-soft: #e0f4e4;
        --leaf: #3d9b4f;
        --card: #ffffff;
        --line: #33241f;
        --pad-bg: #ffffff;
        --pad-border: #f0cfc4;
        --pad-shadow: #e8c9bc;
        --box-border: #33241f;
        --off: #e9ded8;
        --off-stroke: #cbbcb3;
        --rest: #1d6fd1;
        --rest-soft: #dfeefc;
        --blocks-bg: #dff1fa;
        --block-edge: #dd9d00;
        --gold: #f2b705;
        --gold-dark: #b97e00;
        --gold-soft: #fdf0c2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241d1b;
          --ink: #f7ece5;
          --ink-soft: #c4a99d;
          --accent: #ff6a5e;
          --accent-dark: #ff8a7e;
          --accent-soft: #4a2622;
          --green: #5cc977;
          --green-soft: #274433;
          --leaf: #5cc977;
          --card: #322825;
          --line: #f7ece5;
          --pad-bg: #322825;
          --pad-border: #59443c;
          --pad-shadow: #171211;
          --box-border: #f7ece5;
          --off: #453833;
          --off-stroke: #6b554b;
          --rest: #6db3ff;
          --rest-soft: #22384f;
          --blocks-bg: #26333d;
          --block-edge: #c78f00;
          --gold: #f5c542;
          --gold-dark: #f5c542;
          --gold-soft: #4a3d16;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans",
          "Noto Sans JP", sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      button { font-family: inherit; cursor: pointer; }

      .app {
        max-width: 920px;
        margin: 0 auto;
        height: 100dvh;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
      }
      /* play screen is a flex column that must fit inside the
         viewport: every part can shrink a little when height is
         short, so the answer pad never falls off the bottom */
      #playScreen:not([hidden]) {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }

      /* ---------- top bar ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 2px 0;
      }
      .progress-text {
        font-size: clamp(15px, min(3.2vw, 2.8vh), 22px);
        font-weight: 800;
        color: var(--ink-soft);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .progress-text b { color: var(--accent); font-size: 1.25em; }
      .cherries { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
      .cherries svg { width: clamp(22px, min(5vw, 4vh), 34px); height: auto; display: block; }
      .cherries.many { gap: 3px; max-width: 48vw; }
      .cherries.many svg { width: clamp(17px, 3.6vw, 25px); }
      .cherry .fruit { fill: var(--off); }
      .cherry .stem, .cherry .leaf { stroke: var(--off-stroke); }
      .cherry .leaf { fill: none; }
      .cherry.on .fruit { fill: var(--accent); }
      .cherry.on .stem { stroke: var(--leaf); }
      .cherry.on .leaf { stroke: var(--leaf); fill: var(--leaf); }
      .cherry.pop { animation: cherry-pop 0.28s ease; }
      @keyframes cherry-pop {
        0% { transform: scale(0.4); }
        60% { transform: scale(1.25); }
        100% { transform: scale(1); }
      }

      /* ---------- play screen ---------- */
      .hint {
        text-align: center;
        font-size: clamp(17px, min(4.2vw, 3.6vh), 27px);
        font-weight: 800;
        color: var(--ink);
        margin: clamp(4px, 1vh, 12px) 0 0;
        min-height: 2.9em;
        line-height: 1.45;
        flex: 0 0 auto;
      }
      .hint .hl { color: var(--accent); }

      .stage {
        flex: 1 1 auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: clamp(2px, 0.8vh, 10px);
        /* no fixed min-height: the stage is the one flexible part
           and gives back height first, so the blocks, feedback and
           answer pad always stay inside the screen */
        min-height: 0;
        position: relative;
      }
      .equation {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: clamp(6px, 2vw, 20px);
      }
      .num, .op, .answer-slot {
        font-size: clamp(46px, min(15.5vw, 13.5vh), 118px);
        font-weight: 800;
        line-height: 1.08;
        color: var(--ink);
      }
      .op { padding: 0 0.02em; }
      button.num {
        background: none;
        border: none;
        padding: 0 0.04em;
        margin: 0 -0.04em;
        position: relative;
        border-radius: 24px;
        color: var(--ink);
      }
      button.num.tappable { color: var(--accent-dark); }
      button.num.tappable::after {
        content: "";
        position: absolute;
        inset: -6px -2px;
        border: 4px dashed var(--accent);
        border-radius: 26px;
        opacity: 0.85;
        animation: ring-pulse 0.85s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes ring-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.07); opacity: 0.45; }
      }
      button.num.opened { color: var(--ink); }
      button.num.opened::after { display: none; }

      .answer-slot {
        min-width: 1.55em;
        text-align: center;
        color: var(--ink-soft);
        background: var(--card);
        border: 5px solid var(--pad-border);
        border-radius: 26px;
        padding: 0 0.08em;
      }
      .answer-slot.filled {
        color: var(--green);
        border-color: var(--green);
        background: var(--green-soft);
        animation: slot-pop 0.3s ease;
      }
      @keyframes slot-pop {
        0% { transform: scale(0.6); }
        60% { transform: scale(1.12); }
        100% { transform: scale(1); }
      }

      /* sakuranbo diagram, hanging under either number */
      .split-wrap { position: relative; display: inline-block; }
      /* the front number's sakuranbo leans right: its apex sits at 27%
         of its width, so the diagram starts near the screen's left edge
         and both boxes stay visible even on narrow phones.
         the diagram is deliberately wide: the two split boxes sit far
         apart, so the slanted ten-loop (10 box → subtrahend) passes
         through the gap between them and the ones-digit box (the blue
         "rest" box) stays clearly outside the loop */
      .sakura.sakura-a {
        width: min(272px, 70vw, 46vh);
        transform: translateX(-27%) scale(0.92);
      }
      .sakura.sakura-a.shown { transform: translateX(-27%) scale(1); }
      .sakura {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%) scale(0.92);
        width: min(228px, 60vw, 40vh);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
        pointer-events: none;
        z-index: 3;
      }
      .sakura.shown {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) scale(1);
        pointer-events: auto;
      }
      .sakura svg { display: block; width: 100%; height: auto; overflow: visible; }
      .sakura .branch {
        stroke: var(--line);
        stroke-width: 5;
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }
      .sakura.shown .branch { animation: draw 0.26s ease forwards; }
      .sakura.shown .branch.r { animation-delay: 0.06s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .boxes { display: flex; justify-content: space-between; margin-top: 2px; }
      .box {
        width: clamp(48px, min(15vw, 9.5vh), 76px);
        height: clamp(48px, min(15vw, 9.5vh), 76px);
        background: var(--card);
        border: 4px solid var(--box-border);
        border-radius: 16px;
        font-size: clamp(30px, min(9vw, 6.5vh), 50px);
        font-weight: 800;
        color: var(--accent-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        opacity: 0;
        transform: scale(0.5);
      }
      .sakura.shown .box { animation: box-in 0.2s ease forwards; }
      .sakura.shown .box.r { animation-delay: 0.12s; }
      @keyframes box-in { to { opacity: 1; transform: scale(1); } }
      .sakura.shown .box:not(.revealed) { animation: box-in 0.2s ease forwards, box-wiggle 1.1s ease-in-out 0.3s infinite; }
      .sakura.shown .box.r:not(.revealed) { animation: box-in 0.2s ease 0.12s forwards, box-wiggle 1.1s ease-in-out 0.42s infinite; }
      @keyframes box-wiggle {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.06) rotate(-1.5deg); }
      }
      .sakura.shown .box.revealed {
        border-color: var(--accent);
        background: var(--accent-soft);
        opacity: 1;
        transform: scale(1);
        animation: num-pop 0.26s ease;
      }
      /* the number that makes 10 with the partner: red.
         the leftover number: blue, frame and digit alike */
      .sakura.shown .box.revealed.need {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-dark);
      }
      .sakura.shown .box.revealed.rest {
        border-color: var(--rest);
        background: var(--rest-soft);
        color: var(--rest);
      }
      @keyframes num-pop {
        0% { transform: scale(0.4); }
        60% { transform: scale(1.18); }
        100% { transform: scale(1); }
      }

      /* the 10 can be dragged onto the number being subtracted */
      .sakura.shown .box.revealed.need.draggable {
        cursor: grab;
        touch-action: none;
        animation: num-pop 0.26s ease, need-pulse 1.15s ease-in-out 0.3s infinite;
      }
      @keyframes need-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(224, 52, 43, 0.4); }
        50% { box-shadow: 0 0 0 11px rgba(224, 52, 43, 0); }
      }
      .box.dragging {
        cursor: grabbing;
        position: relative;
        box-shadow: 0 14px 28px rgba(51, 36, 31, 0.3);
        opacity: 0.95;
      }
      .num { transition: transform 0.12s ease, color 0.12s ease; }
      .num.drop-hint { color: var(--accent); transform: scale(1.1); }

      /* loop drawn around the partner and the dragged number, with a 10 badge.
         it sits BELOW the sakura diagram (z-index 3): the slanted band
         between the 10 box and the subtrahend passes right where the
         ones-digit box (the blue "rest" box) stands, and no straight
         band around the two numbers can miss it — so the boxes, which
         have solid card backgrounds, paint over the loop and the line
         slips behind that box instead of crossing its number */
      .ten-group {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      .ten-loop {
        position: absolute;
        border: 6px solid var(--accent);
        border-radius: 999px;
        background: transparent;
      }
      .ten-group.pop .ten-loop { animation: loop-pop 0.34s ease; }
      @keyframes loop-pop {
        0% { scale: 0.6; opacity: 0; }
        60% { scale: 1.08; opacity: 1; }
        100% { scale: 1; opacity: 1; }
      }
      .ten-badge {
        position: absolute;
        transform: translate(-50%, -50%);
        background: var(--card);
        border: 5px solid var(--accent);
        border-radius: 999px;
        color: var(--accent-dark);
        font-size: clamp(30px, min(8vw, 6.5vh), 52px);
        font-weight: 800;
        line-height: 1.15;
        padding: 0;
        width: clamp(50px, min(13vw, 9.5vh), 76px);
        height: clamp(50px, min(13vw, 9.5vh), 76px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        pointer-events: none;
      }
      .ten-badge.empty {
        pointer-events: auto;
        cursor: pointer;
      }
      .ten-badge.empty:active { transform: translate(-50%, -50%) scale(0.92); }
      /* the badge is centred on its left/top point by
         transform: translate(-50%, -50%). Its pop / wiggle must
         therefore NOT animate `transform` (the old num-pop /
         box-wiggle keyframes did, which knocked the badge half its
         own size off its anchor and made it jump whenever the
         animation set changed, e.g. when the number was revealed).
         Animate the independent scale / rotate properties instead:
         they compose with the centring transform and the badge
         stays exactly where it was placed */
      .ten-group.pop .ten-badge { animation: badge-pop 0.34s ease; }
      .ten-group.pop .ten-badge.empty {
        animation: badge-pop 0.34s ease, badge-wiggle 1.1s ease-in-out 0.45s infinite;
      }
      @keyframes badge-pop {
        0% { scale: 0.4; }
        60% { scale: 1.18; }
        100% { scale: 1; }
      }
      @keyframes badge-wiggle {
        0%, 100% { scale: 1; rotate: 0deg; }
        50% { scale: 1.06; rotate: -1.5deg; }
      }

      /* ---------- counting blocks (textbook style) ----------
         yellow cubes under the equation, moving in step with the
         sakuranbo: a cubes at first (a row of 10, then the ones),
         the sakura split tints the 10-group red and the ones blue,
         grouping slides the b taken cubes aside faded, and once the
         leftover is revealed the taken cubes shrink away. The 10-row
         and the ones-row are separate rows that never merge: the
         ones cubes stay on the lower row even after the taken cubes
         leave, so the answer reads as "diff on top, ones below" */
      .blocks-panel {
        --bs: clamp(26px, min(8.2vw, 6.2vh), 52px);
        background: var(--blocks-bg);
        border-radius: 20px;
        width: min(640px, 96vw);
        margin: 0 auto 2px;
        padding: 10px 12px 12px;
        flex-shrink: 0;
      }
      .blocks-caption {
        text-align: center;
        font-size: clamp(19px, min(5vw, 3.9vh), 29px);
        font-weight: 800;
        color: var(--ink);
        min-height: 1.4em;
        line-height: 1.35;
        margin-bottom: 8px;
      }
      .blocks-caption .hl { color: var(--accent); }
      .blocks-caption .hl-b { color: var(--rest); }
      .blocks-flow {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: calc(var(--bs) * 10);
        max-width: 100%;
        margin: 0 auto;
      }
      /* one row per group: the 10-row on top, the ones-row below.
         Cubes inside a row touch each other with no horizontal gap,
         like a real ten-bar of counting blocks */
      .blocks-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 0;
      }
      .block-cube {
        width: var(--bs);
        height: var(--bs);
        flex: 0 0 auto;
        border-radius: 8px;
        border: 2.5px solid var(--block-edge);
        background: linear-gradient(180deg, #ffe066 0%, #ffc93c 55%, #f6ac1e 100%);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.55),
          inset 0 -5px 0 rgba(178, 118, 0, 0.35),
          0 4px 0 #a8adb3;
        transition:
          transform 0.45s ease,
          opacity 0.45s ease,
          width 0.45s ease,
          margin 0.45s ease,
          outline-color 0.2s ease;
      }
      .blocks-panel.is-split .block-cube.is-ones { transform: translateY(5px); }
      .block-cube.hl-ten { outline: 3px solid var(--accent); outline-offset: 1px; }
      .block-cube.hl-ones { outline: 3px solid var(--rest); outline-offset: 1px; }
      .blocks-panel.is-dragging .block-cube.is-ten { animation: block-wiggle 0.7s ease-in-out infinite; }
      @keyframes block-wiggle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      /* the cubes taken away from the 10: dashed, faded, slid aside */
      .block-cube.taken {
        opacity: 0.45;
        filter: saturate(0.35);
        transform: translateX(12px);
        outline: 3px dashed var(--accent);
        outline-offset: 2px;
      }
      .blocks-panel.is-split .block-cube.taken { transform: translateX(12px); }
      /* once the leftover is shown, the taken cubes leave for good.
         Only their own row shrinks: the ones cubes stay put on the
         lower row instead of flowing up into the 10-row */
      .block-cube.gone {
        width: 0;
        margin-right: 0;
        border-width: 0;
        opacity: 0;
        transform: translateX(30px) scale(0.4);
        outline: none;
      }
      .block-cube.final { outline: 3px solid var(--green); outline-offset: 1px; }
      .blocks-panel.is-joined .block-cube:not(.gone) { animation: block-pop 0.35s ease; }
      @keyframes block-pop {
        0% { scale: 0.6; }
        60% { scale: 1.15; }
        100% { scale: 1; }
      }
      .blocks-panel.is-done .block-cube:not(.gone) { animation: block-bounce 0.55s ease; }
      @keyframes block-bounce {
        0%, 100% { transform: translateY(0); }
        35% { transform: translateY(-10px); }
        70% { transform: translateY(2px); }
      }

      /* feedback line */
      .feedback {
        text-align: center;
        min-height: clamp(30px, 5.5vh, 48px);
        font-size: clamp(21px, min(5.4vw, 4.2vh), 34px);
        flex-shrink: 0;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .feedback.good { color: var(--green); animation: fb-pop 0.28s ease; }
      .feedback.try { color: var(--accent-dark); font-size: clamp(17px, min(4.4vw, 3.4vh), 27px); }
      @keyframes fb-pop {
        0% { transform: scale(0.5); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); }
      }
      .star-burst { position: relative; width: 0; height: 0; }
      .star-burst svg {
        position: absolute;
        width: 30px;
        height: 30px;
        left: -15px;
        top: -15px;
        fill: #f7b731;
        stroke: #e39a00;
        stroke-width: 1.5;
        animation: burst 0.55s ease-out forwards;
      }
      @keyframes burst {
        0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(160deg); opacity: 0; }
      }

      /* ---------- answer pad ---------- */
      .pad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(8px, 2vw, 14px);
        padding-bottom: 2px;
        flex: 0 0 auto;
      }
      @media (min-width: 760px) {
        .pad { grid-template-columns: repeat(8, 1fr); }
      }
      .pad button {
        background: var(--pad-bg);
        border: 4px solid var(--pad-border);
        border-bottom-width: 6px;
        border-radius: 18px;
        min-height: clamp(46px, 8.5vh, 72px);
        font-size: clamp(26px, min(6vw, 5vh), 40px);
        font-weight: 800;
        color: var(--ink);
        transition: transform 0.05s ease, background 0.1s ease;
      }
      .pad button:active { transform: translateY(3px) scale(0.97); }
      .pad button.wrong {
        background: var(--off);
        border-color: var(--off-stroke);
        color: var(--ink-soft);
        opacity: 0.55;
        animation: shake 0.28s ease;
        pointer-events: none;
      }
      .pad button.correct {
        background: var(--green-soft);
        border-color: var(--green);
        color: var(--green);
      }
      .pad button:disabled { cursor: default; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-7px); }
        75% { transform: translateX(7px); }
      }

      /* ---------- title screen ---------- */
      .title-screen {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-top: clamp(8px, 2vh, 24px);
        padding-bottom: 8px;
      }
      .title-screen .title-cherries { display: flex; gap: 10px; margin-bottom: 2px; }
      .title-screen .title-cherries svg { width: clamp(48px, min(13vw, 10vh), 84px); height: auto; display: block; }
      .title-name {
        font-size: clamp(34px, min(9vw, 8vh), 64px);
        font-weight: 800;
        margin: 2px 0 4px;
        color: var(--accent-dark);
        line-height: 1.25;
      }
      .title-lead {
        font-size: clamp(16px, min(4.4vw, 3.4vh), 24px);
        font-weight: 800;
        margin: 0 0 clamp(12px, 2.5vh, 24px);
      }
      .count-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(12px, 2.2vh, 20px) clamp(12px, 2.5vw, 20px);
        width: min(600px, 94vw);
      }
      .count-row { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
      .count-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-bottom: 7px solid var(--accent-dark);
        border-radius: 999px;
        font-size: clamp(23px, min(6vw, 4.6vh), 34px);
        font-weight: 800;
        padding: clamp(9px, 1.8vh, 14px) 12px;
        width: 100%;
        transition: transform 0.08s ease;
      }
      .count-btn-all { font-size: clamp(19px, min(5vw, 3.9vh), 28px); line-height: 1.25; }
      .count-btn-all .cb-sub {
        display: block;
        font-size: 0.66em;
        font-weight: 800;
        opacity: 0.92;
        margin-top: 1px;
      }
      .count-btn:active { transform: translateY(4px); border-bottom-width: 3px; }
      .best-box { text-align: center; }
      .best-label {
        display: block;
        font-size: clamp(13px, 3.4vw, 16px);
        font-weight: 800;
        color: var(--ink-soft);
        letter-spacing: 0.05em;
      }
      .best-time {
        display: block;
        font-size: clamp(21px, 5.2vw, 29px);
        font-weight: 800;
        color: var(--rest);
        white-space: nowrap;
      }
      .best-time.none { color: var(--ink-soft); font-size: clamp(16px, 4.2vw, 21px); }

      /* ---------- result screen ---------- */
      .result {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: clamp(6px, 1.5vh, 20px);
        padding-bottom: 10px;
        position: relative;
      }
      .result .big-cherries { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
      .result .big-cherries svg { width: clamp(36px, min(10vw, 7vh), 60px); height: auto; }
      .result .big-cherries.many { gap: 5px; }
      .result .big-cherries.many svg { width: clamp(26px, 6vw, 38px); }
      .result h1 {
        font-size: clamp(28px, min(7.6vw, 6.5vh), 52px);
        font-weight: 800;
        margin: 4px 0 2px;
        color: var(--accent-dark);
      }
      .result .score-line {
        font-size: clamp(20px, 5vw, 30px);
        font-weight: 800;
        margin: 0 0 8px;
      }
      .result .score-line b { color: var(--accent); font-size: 1.3em; }
      .result .time-line {
        font-size: clamp(19px, 4.8vw, 27px);
        font-weight: 800;
        margin: 0 0 4px;
      }
      .result .time-line b { color: var(--rest); font-size: 1.2em; }
      .result .best-note {
        font-size: clamp(16px, 4.2vw, 22px);
        font-weight: 800;
        color: var(--accent-dark);
        margin: 0 0 10px;
        min-height: 1.4em;
      }
      .result-btns { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .title-btn {
        background: var(--card);
        color: var(--ink);
        border: 4px solid var(--pad-border);
        border-bottom-width: 7px;
        border-radius: 999px;
        font-size: clamp(19px, 4.8vw, 26px);
        font-weight: 800;
        padding: 12px 38px;
        transition: transform 0.08s ease;
      }
      .title-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
      .result .message {
        font-size: clamp(15px, min(4.2vw, 3vh), 23px);
        font-weight: 700;
        line-height: 1.5;
        color: var(--ink);
        margin: 0 0 12px;
        max-width: 34em;
      }
      .review {
        list-style: none;
        margin: 0 0 8px;
        padding: 10px 18px;
        background: var(--card);
        border: 3px solid var(--pad-border);
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: min(340px, 84vw);
      }
      .review li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        font-size: clamp(17px, min(4.6vw, 3.2vh), 24px);
        font-weight: 800;
            }
      .review .mark { font-size: 1.05em; }
      .review .mark.first { color: var(--accent); }
      .review .mark.retry { color: var(--green); }
      .legend {
        font-size: clamp(13px, 3.4vw, 16px);
        font-weight: 700;
        color: var(--ink-soft);
        margin: 0 0 14px;
      }
      .again-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-bottom: 7px solid var(--accent-dark);
        border-radius: 999px;
        font-size: clamp(21px, min(5.6vw, 4.4vh), 32px);
        font-weight: 800;
        padding: clamp(10px, 2vh, 16px) 52px;
        letter-spacing: 0.03em;
        transition: transform 0.08s ease;
      }
      .again-btn:active { transform: translateY(4px); border-bottom-width: 3px; }
      .fall-star {
        position: absolute;
        top: -40px;
        pointer-events: none;
        animation: fall linear forwards;
      }
      .fall-star svg { display: block; }
      @keyframes fall {
        to { transform: translateY(105dvh) rotate(320deg); }
      }

      /* ---------- guess overlay (よそう) ---------- */
      .guess-overlay {
        position: fixed;
        inset: 0;
        background: rgba(30, 18, 14, 0.42);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 60;
      }
      .guess-panel {
        background: var(--card);
        border: 4px solid var(--pad-border);
        border-radius: 24px;
        padding: 18px 18px 20px;
        width: min(360px, 92vw);
        text-align: center;
        box-shadow: 0 16px 36px rgba(30, 18, 14, 0.28);
        animation: num-pop 0.22s ease;
      }
      .guess-q {
        font-size: clamp(20px, 5.4vw, 27px);
        font-weight: 800;
        margin: 0 0 14px;
        line-height: 1.35;
      }
      .guess-choices { display: flex; gap: 12px; justify-content: center; }
      .guess-choices button {
        flex: 1 1 0;
        min-height: clamp(60px, 10vh, 76px);
        font-size: clamp(28px, 7vw, 38px);
        font-weight: 800;
        color: var(--ink);
        background: var(--pad-bg);
        border: 4px solid var(--pad-border);
        border-bottom-width: 7px;
        border-radius: 18px;
        transition: transform 0.05s ease;
      }
      .guess-choices button:active { transform: translateY(3px) scale(0.97); }

      /* ---------- result: grade cherries & compact lines ---------- */
      .cherry.gold .fruit { fill: var(--gold); }
      .cherry.gold .stem { stroke: var(--leaf); }
      .cherry.gold .leaf { stroke: var(--leaf); fill: var(--leaf); }
      .cherry.red .fruit { fill: var(--accent); }
      .cherry.red .stem { stroke: var(--leaf); }
      .cherry.red .leaf { stroke: var(--leaf); fill: var(--leaf); }
      .cherry.outline .fruit {
        fill: none;
        stroke: var(--ink-soft);
        stroke-width: 2.5;
      }
      .cherry.outline .stem { stroke: var(--ink-soft); }
      .cherry.outline .leaf { stroke: var(--ink-soft); fill: none; }
      .cherries.all { gap: 2px; }
      .cherries.all svg { width: 14px; }
      .result .big-cherries.all { gap: 4px; }
      .result .big-cherries.all svg { width: clamp(19px, 4.4vw, 28px); }
      .result .counts-line {
        font-size: clamp(15px, 4vw, 20px);
        font-weight: 800;
        color: var(--ink-soft);
        margin: 2px 0 6px;
      }
      .result .counts-line .c-gold { color: var(--gold-dark); }
      .result .counts-line .c-red { color: var(--accent); }
      .result .time-small {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: clamp(14px, 3.8vw, 18px);
        font-weight: 800;
        color: var(--ink-soft);
        margin: 0 0 4px;
      }
      .result .time-small svg { width: 1.15em; height: 1.15em; display: block; }
      .result .best-note:empty { display: none; }
      .result .best-note {
        font-size: clamp(16px, 4.2vw, 21px);
        color: var(--gold-dark);
        margin: 0 0 8px;
        min-height: 0;
      }
      .result .goal-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: clamp(17px, 4.6vw, 24px);
        font-weight: 800;
        margin: 4px 0 14px;
      }
      .result .goal-line svg { width: 1.3em; height: 1.3em; display: block; flex: 0 0 auto; }
      .detail-btn {
        background: var(--card);
        color: var(--ink);
        border: 3px solid var(--pad-border);
        border-bottom-width: 6px;
        border-radius: 999px;
        font-size: clamp(16px, 4.2vw, 21px);
        font-weight: 800;
        padding: 8px 30px;
        margin: 0 0 14px;
        transition: transform 0.08s ease;
      }
      .detail-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
      .review-wrap { display: flex; flex-direction: column; align-items: center; }
      .review .mark.gold { color: var(--gold-dark); }
      .review .mark.red { color: var(--accent); }
      .review .mark.outline { color: var(--ink-soft); }
      .legend .lg-gold { color: var(--gold-dark); }
      .legend .lg-red { color: var(--accent); }

      /* ---------- result: weak-problem box (initial view, small) ---------- */
      .weak-box {
        background: var(--accent-soft);
        border-radius: 18px;
        padding: 10px 16px 12px;
        margin: 0 0 14px;
        width: min(480px, 92vw);
      }
      .weak-title {
        font-size: clamp(16px, 4.4vw, 21px);
        font-weight: 800;
        margin: 0 0 8px;
      }
      .weak-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
        margin: 0 0 8px;
      }
      .weak-chip {
        background: var(--card);
        border: 3px solid var(--pad-border);
        border-radius: 999px;
        padding: 3px 14px;
        font-size: clamp(16px, 4.4vw, 21px);
        font-weight: 800;
        white-space: nowrap;
      }
      .weak-more {
        font-size: clamp(14px, 3.8vw, 18px);
        font-weight: 800;
        color: var(--ink-soft);
      }
      .weak-note {
        font-size: clamp(14px, 3.8vw, 18px);
        font-weight: 800;
        color: var(--accent-dark);
        margin: 0;
      }

      /* ---------- result detail: colour legend ---------- */
      .color-legend {
        margin: 4px 0 14px;
        text-align: left;
        max-width: min(480px, 88vw);
      }
      .color-legend-title {
        font-size: clamp(16px, 4.4vw, 21px);
        font-weight: 800;
        margin: 0 0 8px;
        text-align: center;
      }
      .color-legend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: clamp(14px, 3.9vw, 19px);
        font-weight: 800;
        line-height: 1.4;
        margin: 0 0 6px;
      }
      .color-legend-row:last-child { margin-bottom: 0; }
      .mini-cherry { flex: 0 0 auto; display: inline-flex; }
      .mini-cherry svg { width: clamp(22px, 5.5vw, 28px); height: auto; display: block; }

      /* ---------- guide (あそびかた) & in-play help ---------- */
      .tb-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
      .help-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--card);
        border: 3px solid var(--pad-border);
        border-bottom-width: 5px;
        color: var(--accent-dark);
        font-size: 21px;
        font-weight: 800;
        line-height: 1;
        padding: 0;
      }
      .help-btn:active { transform: translateY(2px); border-bottom-width: 3px; }
      .quit-btn {
        background: var(--card);
        border: 3px solid var(--pad-border);
        border-bottom-width: 5px;
        border-radius: 999px;
        font-weight: 800;
        font-size: clamp(14px, 3.6vw, 18px);
        padding: 5px 18px;
        color: var(--ink);
      }
      .quit-btn:active { transform: translateY(2px); border-bottom-width: 3px; }
      .guide-btn {
        margin-top: clamp(12px, 2.2vh, 20px);
        width: min(600px, 94vw);
        background: var(--green);
        color: #fff;
        border: none;
        border-bottom: 7px solid #257a3c;
        border-radius: 999px;
        font-size: clamp(21px, min(5.6vw, 4.4vh), 32px);
        font-weight: 800;
        padding: clamp(9px, 1.8vh, 14px) 12px;
        transition: transform 0.08s ease;
      }
      .guide-btn:active { transform: translateY(4px); border-bottom-width: 3px; }

      /* one-sentence speech bubble (guide steps & the ？ button) */
      .guide-bubble {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        top: calc(max(10px, env(safe-area-inset-top)) + 52px);
        z-index: 75;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 4px solid var(--accent);
        border-radius: 22px;
        padding: 10px 12px 10px 18px;
        max-width: min(620px, 94vw);
        box-shadow: 0 10px 24px rgba(30, 18, 14, 0.25);
      }
      .guide-bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -13px;
        transform: translateX(-50%);
        border: 7px solid transparent;
        border-top: 9px solid var(--accent);
        border-bottom: 0;
      }
      .guide-bubble-text {
        font-size: clamp(19px, min(5vw, 3.6vh), 29px);
        font-weight: 800;
        margin: 0;
        line-height: 1.35;
      }
      .speak-btn {
        flex: 0 0 auto;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid var(--pad-border);
        background: var(--accent-soft);
        color: var(--accent-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .speak-btn svg { width: 27px; height: 27px; display: block; }
      .speak-btn:active { transform: scale(0.93); }
      /* autoplay was blocked: make the speaker button stand out */
      .speak-btn.attn {
        background: var(--gold-soft);
        border-color: var(--gold);
        animation: ring-pulse 0.85s ease-in-out infinite;
      }

      /* bouncing finger mark that points at the next thing to touch */
      .finger {
        position: fixed;
        z-index: 85;
        pointer-events: none;
        transform: translate(-50%, -18%);
        filter: drop-shadow(0 3px 3px rgba(30, 18, 14, 0.35));
      }
      .finger-in {
        display: block;
        font-size: 42px;
        line-height: 1;
        animation: finger-bounce 0.55s ease-in-out infinite alternate;
      }
      .finger.soft .finger-in { animation-duration: 0.95s; opacity: 0.88; font-size: 36px; }
      @keyframes finger-bounce {
        from { translate: 0 0; }
        to { translate: 0 -12px; }
      }

      /* the element the guide wants touched next glows */
      .guide-glow { animation: glow-pulse 0.9s ease-in-out infinite; }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(224, 52, 43, 0.45); }
        50% { box-shadow: 0 0 0 13px rgba(224, 52, 43, 0); }
      }
      .pad.guide-glow { border-radius: 18px; }

      /* dotted path the demo finger traces during the drag step */
      .drag-path {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 4;
      }
      .drag-path line {
        stroke: var(--accent);
        stroke-width: 5;
        stroke-dasharray: 10 9;
        stroke-linecap: round;
        opacity: 0.75;
      }

      /* tap-rescue: the 10 is selected, waiting for the partner tap */
      .sakura.shown .box.revealed.need.tap-selected {
        box-shadow: 0 0 0 5px var(--green);
        scale: 1.1;
      }

      .guess-panel.shake { animation: shake 0.28s ease; }

      /* guide finished panel */
      .guide-done-panel { width: min(380px, 92vw); }
      .guide-done-cherries { display: flex; gap: 8px; justify-content: center; margin-bottom: 2px; }
      .guide-done-cherries svg { width: 54px; height: auto; display: block; }
      .guide-done-title {
        font-size: clamp(30px, 7.4vw, 44px);
        font-weight: 800;
        color: var(--accent-dark);
        margin: 0 0 14px;
      }
      .guide-done-btns { display: flex; flex-direction: column; gap: 12px; }
      .guide-done-btns .again-btn, .guide-done-btns .title-btn { width: 100%; }

      @media (max-height: 700px) {
        .guide-btn { padding: 8px 12px; }
        .guide-bubble { top: calc(max(8px, env(safe-area-inset-top)) + 44px); padding: 8px 10px 8px 14px; }
        .guide-bubble-text { font-size: clamp(17px, 4.6vw, 24px); }
        .speak-btn { width: 46px; height: 46px; }
      }

      [hidden] { display: none !important; }

      /* ---------- fit-to-screen: shrink with viewport height ----------
         The browser / classroom app chrome eats into the visible
         height on tablets, and phones are shorter still. These
         steps keep hint + equation + sakuranbo + blocks + feedback
         + answer pad all inside 100dvh without scrolling. */
      @media (max-height: 860px) {
        .app { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .progress-text { font-size: clamp(15px, 3vw, 21px); }
        .cherries svg { width: clamp(22px, 4.6vw, 32px); }
        .hint { font-size: clamp(16px, 3.8vw, 24px); margin-top: 6px; }
        .stage { min-height: clamp(150px, 30vh, 260px); padding-top: 2px; }
        .num, .op, .answer-slot { font-size: clamp(52px, min(13.5vw, 12vh), 100px); }
        .answer-slot { border-width: 4px; border-radius: 20px; }
        .sakura.sakura-a { width: min(232px, 64vw, 40vh); }
        .sakura { width: min(200px, 56vw); }
        .box { width: clamp(52px, 13vw, 66px); height: clamp(52px, 13vw, 66px); font-size: clamp(32px, 8vw, 44px); border-width: 4px; border-radius: 15px; }
        .ten-badge { width: clamp(50px, 11vw, 66px); height: clamp(50px, 11vw, 66px); font-size: clamp(30px, 7vw, 46px); border-width: 4px; }
        .blocks-panel { --bs: clamp(26px, min(7.4vw, 5.6vh), 46px); padding: 8px 10px 11px; }
        .blocks-caption { font-size: clamp(17px, min(4.6vw, 3.5vh), 26px); margin-bottom: 7px; }
        .blocks-flow { gap: 5px; }
        .feedback { min-height: 32px; font-size: clamp(20px, 5vw, 32px); }
        .feedback.try { font-size: clamp(17px, 4.2vw, 26px); }
        .pad button { min-height: clamp(48px, 8.5vh, 68px); font-size: clamp(24px, 5.4vw, 36px); }
        .title-screen .title-cherries svg { width: clamp(52px, 12vw, 76px); }
        .title-name { font-size: clamp(34px, 8.5vw, 58px); }
        .title-lead { margin-bottom: 18px; }
        .count-list { gap: 12px; }
        .count-btn { padding: 10px 14px; }
      }
      @media (max-height: 700px) {
        .hint { font-size: clamp(15px, 3.6vw, 21px); min-height: 2.9em; margin-top: 4px; }
        .stage { min-height: clamp(132px, 28vh, 220px); }
        .num, .op, .answer-slot { font-size: clamp(44px, min(11.5vw, 11vh), 80px); }
        .sakura.sakura-a { width: min(180px, 54vw, 36vh); }
        .sakura { width: min(168px, 50vw); }
        .box { width: clamp(44px, 11vw, 54px); height: clamp(44px, 11vw, 54px); font-size: clamp(27px, 7vw, 38px); }
        .ten-badge { width: clamp(44px, 10vw, 56px); height: clamp(44px, 10vw, 56px); font-size: clamp(26px, 6vw, 38px); }
        .blocks-panel { --bs: clamp(24px, min(6.8vw, 5.2vh), 40px); border-radius: 18px; }
        .blocks-caption { font-size: clamp(16px, min(4.4vw, 3.3vh), 24px); }
        .feedback { min-height: 27px; font-size: clamp(18px, 4.6vw, 27px); }
        .pad { gap: 7px; }
        .pad button { min-height: clamp(42px, 8vh, 56px); border-radius: 14px; border-bottom-width: 5px; }
        .title-screen { padding-top: 6px; }
        .title-screen .title-cherries svg { width: clamp(42px, 10vw, 60px); }
        .title-name { font-size: clamp(30px, 8vw, 48px); margin: 2px 0 2px; }
        .title-lead { font-size: clamp(16px, 4.2vw, 22px); margin-bottom: 12px; }
        .count-btn { font-size: clamp(22px, 5.6vw, 30px); padding: 8px 12px; }
        .count-btn-all { font-size: clamp(18px, 4.8vw, 25px); }
        .result h1 { font-size: clamp(28px, 7.4vw, 46px); }
        .result .big-cherries svg { width: clamp(36px, 9vw, 52px); }
        .result .message { margin-bottom: 12px; }
        .legend { margin-bottom: 14px; }
        .again-btn { padding: 11px 40px; }
      }
      @media (max-height: 560px) {
        .app { padding-left: 12px; padding-right: 12px; }
        .topbar { padding-top: 0; }
        .progress-text { font-size: 14px; }
        .cherries svg { width: 20px; }
        .hint { font-size: 15px; }
        .stage { min-height: 118px; }
        .num, .op, .answer-slot { font-size: clamp(38px, min(10vw, 10vh), 60px); }
        .sakura.sakura-a { width: min(152px, 48vw, 32vh); }
        .box { width: 40px; height: 40px; font-size: 24px; border-width: 3px; border-radius: 12px; }
        .blocks-panel { --bs: clamp(22px, min(6.2vw, 4.8vh), 34px); padding: 7px 8px 9px; }
        .blocks-caption { font-size: clamp(15px, min(4.2vw, 3.1vh), 21px); margin-bottom: 6px; }
        .feedback { min-height: 24px; font-size: 17px; }
        .pad button { min-height: 38px; font-size: 22px; }
      }
      /* narrow phones: keep the 8 answer buttons in 2 tidy rows
         and let the equation use the full width without overflow */
      @media (max-width: 480px) {
        .app { padding-left: 10px; padding-right: 10px; }
        .equation { gap: 4px; }
        .blocks-panel { width: 100%; }
      }
      /* short landscape (tablet / phone sideways): two-column feel
         is not needed — the height steps above already compact
         everything; just keep the pad in one row when wide enough */
      @media (max-height: 700px) and (min-width: 760px) {
        .pad { grid-template-columns: repeat(8, 1fr); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .sakura .branch { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar" id="topbar" hidden>
        <div class="progress-text" id="progressText"></div>
        <div class="tb-actions">
          <button type="button" class="help-btn" id="helpBtn" hidden aria-label="ひんとを みる">？</button>
          <button type="button" class="quit-btn" id="quitBtn" hidden>やめる</button>
        </div>
        <div class="cherries" id="progressCherries" aria-hidden="true"></div>
      </header>

      <!-- ======== title screen ======== -->
      <section id="titleScreen" class="title-screen">
        <div class="title-cherries" id="titleCherries" aria-hidden="true"></div>
        <h1 class="title-name">さくらんぼ ひきざん</h1>
        <p class="title-lead">なんもん あそぶ？ タッチで スタート！</p>
        <div class="count-list">
          <div class="count-row">
            <button type="button" class="count-btn" data-count="5">5もん</button>
            <div class="best-box">
              <span class="best-label">ベストタイム</span>
              <span class="best-time none" id="best5">まだ ない。</span>
            </div>
          </div>
          <div class="count-row">
            <button type="button" class="count-btn" data-count="10">10もん</button>
            <div class="best-box">
              <span class="best-label">ベストタイム</span>
              <span class="best-time none" id="best10">まだ ない。</span>
            </div>
          </div>
          <div class="count-row">
            <button type="button" class="count-btn" data-count="20">20もん</button>
            <div class="best-box">
              <span class="best-label">ベストタイム</span>
              <span class="best-time none" id="best20">まだ ない。</span>
            </div>
          </div>
          <div class="count-row">
            <button type="button" class="count-btn count-btn-all" data-count="all">ぜんぶの もんだい<span class="cb-sub" id="allCountSub"></span></button>
            <div class="best-box">
              <span class="best-label">ベストタイム</span>
              <span class="best-time none" id="bestAll">まだ ない。</span>
            </div>
          </div>
        </div>
        <button type="button" class="guide-btn" id="guideBtn">あそびかた</button>
      </section>

      <!-- ======== play screen ======== -->
      <section id="playScreen" hidden>
        <p class="hint" id="hint"></p>

        <div class="stage" id="stage">
          <div class="equation" id="equation">
            <span class="split-wrap">
              <button type="button" class="num tappable" id="numA" aria-label="2けたの かずを タッチして さくらんぼに する">13</button>
              <div class="sakura sakura-a" id="sakuraA">
                <svg viewBox="0 0 200 96" aria-hidden="true">
                  <path class="branch l" pathLength="100" d="M54 4 L28 92" />
                  <path class="branch r" pathLength="100" d="M54 4 L172 92" />
                </svg>
                <div class="boxes">
                  <button type="button" class="box l" id="boxAL" aria-label="さくらんぼの ひだりの しかく"></button>
                  <button type="button" class="box r" id="boxAR" aria-label="さくらんぼの みぎの しかく"></button>
                </div>
              </div>
            </span>
            <span class="op">−</span>
            <span class="num" id="numB">9</span>
            <span class="op">=</span>
            <span class="answer-slot" id="answerSlot">？</span>
          </div>
          <div class="ten-group" id="tenGroup" hidden>
            <div class="ten-loop" id="tenLoop"></div>
            <button type="button" class="ten-badge empty" id="tenBadge" aria-label="まるを タッチして こたえを みる"></button>
          </div>

        </div>

          <div class="blocks-flow" id="blocksFlow"></div>

        <div class="feedback" id="feedback" aria-live="polite"></div>

        <div class="pad" id="pad" role="group" aria-label="こたえの かず"></div>
      </section>

      <!-- ======== guess overlay ======== -->
      <div class="guess-overlay" id="guessOverlay" hidden>
        <div class="guess-panel" id="guessPanel" role="dialog" aria-label="よそう">
          <p class="guess-q">なんの かずだと おもう？</p>
          <div class="guess-choices" id="guessChoices"></div>
        </div>
      </div>

      <!-- ======== guide: speech bubble & finger mark ======== -->

        <button type="button" class="speak-btn" id="speakBtn" aria-label="こえで きく">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.8a4.4 4.4 0 0 1 0 6.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18.4 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>

        <p class="best-note" id="bestNote"></p>
        <p class="goal-line">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42 C10 34 6 20 8 6 C22 8 34 16 38 30 C40 38 32 44 24 42 Z" fill="var(--leaf)"/><path d="M14 36 C20 26 28 18 36 12" fill="none" stroke="var(--card)" stroke-width="3" stroke-linecap="round"/></svg>

          <button type="button" class="title-btn" id="titleBtn">タイトルに もどる。</button>
        </div>
