    <script>
      (function () {
        "use strict";

        var total = 5; // questions in the current round (5 / 10 / 20 / whole pool)
        // best ms per count. Light persistence: try to keep them in the
        // browser's local storage so they survive a reload; if storage
        // is unavailable (private mode, blocked iframe storage, ...),
        // fall back to keeping them in memory for this page session.
        var BEST_KEY = "sakuranbo-hikizan-best-times-v2-gold";
        var bestTimes = {};
        (function loadBestTimes() {
          try {
            var raw = window.localStorage.getItem(BEST_KEY);
            if (!raw) return;
            var saved = JSON.parse(raw);
            if (!saved) return;
            Object.keys(saved).forEach(function (k) {
              var v = saved[k];
              if (typeof v === "number" && isFinite(v) && v > 0) bestTimes[k] = v;
            });
          } catch (e) {
            /* storage unavailable: keep the in-memory defaults */
          }
        })();
        function saveBestTimes() {
          try {
            window.localStorage.setItem(BEST_KEY, JSON.stringify(bestTimes));
          } catch (e) {
            /* storage unavailable: best times stay in memory only */
          }
        }
        var startTime = 0;
        var finishTime = 0;
        var CHERRY_SVG =
          '<svg class="cherry" viewBox="0 0 48 48" aria-hidden="true">' +
          '<path class="stem" d="M27 5 C25 13 20 18 14 24" fill="none" stroke-width="3" stroke-linecap="round"/>' +
          '<path class="stem" d="M27 5 C29 13 32 18 35 25" fill="none" stroke-width="3" stroke-linecap="round"/>' +
          '<path class="leaf" d="M27 5 C31 1 37 1 40 3 C37 7 31 8 27 5 Z" stroke-width="2" stroke-linejoin="round"/>' +
          '<circle class="fruit" cx="13" cy="34" r="10"/>' +
          '<circle class="fruit" cx="36" cy="36" r="9"/>' +
          '<circle cx="9.5" cy="30" r="3" fill="#ffffff" opacity="0.45"/>' +
          '<circle cx="32.5" cy="32.5" r="2.6" fill="#ffffff" opacity="0.45"/>' +
          "</svg>";
        var STAR_PATH =
          "M24 4 L30 18 L45 19.5 L34 29 L37.5 44 L24 36.5 L10.5 44 L14 29 L3 19.5 L18 18 Z";

        var el = {
          topbar: document.getElementById("topbar"),
          titleScreen: document.getElementById("titleScreen"),
          titleCherries: document.getElementById("titleCherries"),
          progressText: document.getElementById("progressText"),
          progressCherries: document.getElementById("progressCherries"),
          playScreen: document.getElementById("playScreen"),
          resultScreen: document.getElementById("resultScreen"),
          hint: document.getElementById("hint"),
          stage: document.getElementById("stage"),
          tenGroup: document.getElementById("tenGroup"),
          tenLoop: document.getElementById("tenLoop"),
          tenBadge: document.getElementById("tenBadge"),
          equation: document.getElementById("equation"),
          numA: document.getElementById("numA"),
          numB: document.getElementById("numB"),
          sakuraA: document.getElementById("sakuraA"),
          boxAL: document.getElementById("boxAL"),
          boxAR: document.getElementById("boxAR"),
          answerSlot: document.getElementById("answerSlot"),
          blocksPanel: document.getElementById("blocksPanel"),
          blocksCaption: document.getElementById("blocksCaption"),
          blocksFlow: document.getElementById("blocksFlow"),
          feedback: document.getElementById("feedback"),
          pad: document.getElementById("pad"),
          bigCherries: document.getElementById("bigCherries"),
          resultTitle: document.getElementById("resultTitle"),
          countsLine: document.getElementById("countsLine"),
          goalText: document.getElementById("goalText"),
          timeLine: document.getElementById("timeLine"),
          bestNote: document.getElementById("bestNote"),
          detailToggle: document.getElementById("detailToggle"),
          reviewWrap: document.getElementById("reviewWrap"),
          review: document.getElementById("review"),
          weakBox: document.getElementById("weakBox"),
          weakChips: document.getElementById("weakChips"),
          allCountSub: document.getElementById("allCountSub"),
          guessOverlay: document.getElementById("guessOverlay"),
          guessPanel: document.getElementById("guessPanel"),
          guessChoices: document.getElementById("guessChoices"),
          againBtn: document.getElementById("againBtn"),
          titleBtn: document.getElementById("titleBtn"),
          helpBtn: document.getElementById("helpBtn"),
          quitBtn: document.getElementById("quitBtn"),
          guideBtn: document.getElementById("guideBtn"),
          bubble: document.getElementById("guideBubble"),
          bubbleText: document.getElementById("guideBubbleText"),
          speakBtn: document.getElementById("speakBtn"),
          finger: document.getElementById("fingerMark"),
          fingerIn: document.getElementById("fingerIn"),
          dragPath: document.getElementById("dragPath"),
          dragLine: document.getElementById("dragLine"),
          guideDone: document.getElementById("guideDone"),
          guideDoneCherries: document.getElementById("guideDoneCherries"),
          donePlayBtn: document.getElementById("donePlayBtn"),
          doneAgainBtn: document.getElementById("doneAgainBtn"),
          doneTitleBtn: document.getElementById("doneTitleBtn"),
        };

        // ----- sound (gentle WebAudio tones) -----
        var audioCtx = null;
        function beep(freq, start, dur, type) {
          try {
            if (!audioCtx) {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              audioCtx = new AC();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();
            var t = audioCtx.currentTime + start;
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + dur + 0.05);
          } catch (e) {
            /* sound is optional */
          }
        }
        function sndPop() { beep(740, 0, 0.09, "triangle"); }
        function sndGood() {
          beep(523, 0, 0.12, "triangle");
          beep(659, 0.07, 0.12, "triangle");
          beep(784, 0.14, 0.2, "triangle");
        }
        function sndTry() { beep(220, 0, 0.14, "sine"); }
        function sndTen() {
          beep(784, 0, 0.12, "triangle");
          beep(1047, 0.08, 0.22, "triangle");
        }
        function sndFanfare() {
          var notes = [523, 659, 784, 1047, 784, 1047];
          for (var i = 0; i < notes.length; i++) beep(notes[i], i * 0.09, 0.2, "triangle");
        }

        // ----- question pool: 2-digit (11..18) minus 1-digit, always
        // with borrowing: the subtrahend is bigger than the ones
        // digit, so the answer lands in 2..9 -----
        function buildPool() {
          var pool = [];
          for (var a = 11; a <= 18; a++) {
            for (var b = 2; b <= 9; b++) {
              if (b > a - 10) pool.push({ a: a, b: b });
            }
          }
          return pool;
        }
        var POOL = buildPool();
        var poolKeySet = {};
        POOL.forEach(function (q) { poolKeySet[q.a + "-" + q.b] = true; });
        function qKey(q) { return q.a + "-" + q.b; }
        function keyToQ(k) {
          var p = k.split("-");
          return { a: parseInt(p[0], 10), b: parseInt(p[1], 10) };
        }
        function shuffleArr(arr) {
          for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
          }
          return arr;
        }

        // ----- weak problems, kept on the device between rounds.
        // weakMap: "a-b" -> weight (grows with mistakes). Updated at
        // the end of a round: problems graded がんばった join / gain
        // weight, problems solved きん graduate off the list, and
        // problems solved あか stay on it -----
        var WEAK_KEY = "sakuranbo-hikizan-weak-v1";
        var weakMap = {};
        (function loadWeak() {
          try {
            var raw = window.localStorage.getItem(WEAK_KEY);
            if (!raw) return;
            var saved = JSON.parse(raw);
            if (!saved) return;
            Object.keys(saved).forEach(function (k) {
              var v = saved[k];
              if (poolKeySet[k] && typeof v === "number" && isFinite(v) && v > 0) {
                weakMap[k] = v;
              }
            });
          } catch (e) {
            /* storage unavailable: weak list stays in memory only */
          }
        })();
        function saveWeak() {
          try {
            window.localStorage.setItem(WEAK_KEY, JSON.stringify(weakMap));
          } catch (e) {
            /* storage unavailable: weak list stays in memory only */
          }
        }
        // heaviest first; equal weights in random order (shuffle
        // first, then a stable sort by weight)
        function weakKeysByWeight() {
          var keys = Object.keys(weakMap).filter(function (k) {
            return poolKeySet[k] && weakMap[k] > 0;
          });
          shuffleArr(keys);
          keys.sort(function (x, y) { return weakMap[y] - weakMap[x]; });
          return keys;
        }
        var weakApplied = false; // weak list already updated for this round
        function updateWeakFromResults() {
          results.forEach(function (r) {
            var k = r.a + "-" + r.b;
            if (r.grade <= 0) {
              weakMap[k] = (weakMap[k] || 0) + 1 + (r.wrongs || 0);
            } else if (r.grade >= 2) {
              delete weakMap[k]; // graduated: solved きん
            }
            // grade 1 (あか): stays on the list, weight unchanged
          });
          saveWeak();
        }

        // ----- deck: the whole pool shuffled, kept on the device and
        // dealt without repeats, so repeated rounds keep surfacing
        // different problems. When the deck runs out it is rebuilt
        // with the previous round's problems at the bottom, so they
        // come back as late as the pool allows -----
        var DECK_KEY = "sakuranbo-hikizan-deck-v1";
        var deckState = { deck: [], last: [] };
        (function loadDeck() {
          try {
            var raw = window.localStorage.getItem(DECK_KEY);
            if (!raw) return;
            var saved = JSON.parse(raw);
            if (!saved) return;
            if (Array.isArray(saved.deck)) {
              deckState.deck = saved.deck.filter(function (k) { return poolKeySet[k]; });
            }
            if (Array.isArray(saved.last)) {
              deckState.last = saved.last.filter(function (k) { return poolKeySet[k]; });
            }
          } catch (e) {
            /* storage unavailable: deck stays in memory only */
          }
        })();
        function saveDeck() {
          try {
            window.localStorage.setItem(DECK_KEY, JSON.stringify(deckState));
          } catch (e) {
            /* storage unavailable: deck stays in memory only */
          }
        }
        function rebuildDeck(exclude) {
          var lastSet = {};
          deckState.last.forEach(function (k) { lastSet[k] = true; });
          var fresh = [];
          var lastOnes = [];
          POOL.forEach(function (q) {
            var k = qKey(q);
            if (exclude[k]) return;
            if (lastSet[k]) lastOnes.push(k);
            else fresh.push(k);
          });
          shuffleArr(fresh);
          shuffleArr(lastOnes);
          deckState.deck = fresh.concat(lastOnes);
        }
        function drawFromDeck(n, exclude) {
          var out = [];
          var rebuilds = 0;
          while (out.length < n) {
            if (deckState.deck.length === 0) {
              if (++rebuilds > 3) break; // pool exhausted: caller fills in
              var ex = {};
              Object.keys(exclude).forEach(function (k) { ex[k] = true; });
              out.forEach(function (k) { ex[k] = true; });
              rebuildDeck(ex);
              if (deckState.deck.length === 0) break;
            }
            var k = deckState.deck.shift();
            if (exclude[k]) continue;
            exclude[k] = true;
            out.push(k);
          }
          return out;
        }

        // ----- pick a round's questions: up to half (rounded up)
        // come from the saved weak list, the rest are dealt from the
        // deck; no problem repeats inside one round. In ぜんぶ mode
        // every pool problem appears once, with weak ones biased
        // into the first half -----
        function makeQuestions(count) {
          var isAll = count >= POOL.length;
          var used = {};
          var picked = [];
          if (isAll) {
            picked = POOL.map(qKey);
            picked.forEach(function (k) { used[k] = true; });
            deckState.deck = []; // the whole pool was just dealt
          } else {
            var cap = Math.ceil(count / 2);
            weakKeysByWeight().slice(0, cap).forEach(function (k) {
              if (picked.length < count && !used[k]) {
                used[k] = true;
                picked.push(k);
              }
            });
            if (picked.length) {
              // weak picks leave the deck too, so nothing doubles up
              deckState.deck = deckState.deck.filter(function (k) { return !used[k]; });
            }
            picked = picked.concat(drawFromDeck(count - picked.length, used));
            if (picked.length < count) {
              // safety net (the pool is larger than any count, so
              // this should never run): fill from what is left
              var rest = shuffleArr(POOL.map(qKey).filter(function (k) { return !used[k]; }));
              while (picked.length < count && rest.length) {
                var k2 = rest.pop();
                used[k2] = true;
                picked.push(k2);
              }
            }
          }
          deckState.last = picked.slice();
          saveDeck();
          var qs = picked.map(keyToQ);
          if (isAll) {
            qs.forEach(function (q) {
              q.sortKey = weakMap[qKey(q)]
                ? Math.random() * 0.5
                : 0.5 + Math.random() * 0.5;
            });
            qs.sort(function (x, y) { return x.sortKey - y.sortKey; });
            qs.forEach(function (q) { delete q.sortKey; });
          } else {
            shuffleArr(qs);
          }
          return qs;
        }

        // ----- state -----
        var questions = [];
        var idx = 0;
        var score = 0; // first-try correct count
        var results = [];
        var cur = null; // {a,b,ans,ones,diff} — a splits into 10 and ones;
        // 10 − b = diff; diff + ones = ans
        var openSide = null; // null | "A" — the 2-digit number is split open
        var revealedL = false;
        var revealedR = false;
        var firstTry = true;
        var locked = false;
        var advanceTimer = null;
        var grouped = false; // partner + the "make 10" number are looped as 10
        var badgeRevealed = false; // the round badge under the 10 starts empty; tapping it shows 10 − b
        // ----- guess (よそう) tracking, per question -----
        var openedEver = { L: false, R: false, badge: false }; // any reveal this question
        var guessDone = { L: false, R: false, badge: false }; // guess asked once per element per question
        var guessMissed = false; // any wrong guess this question ("ヒントを みた")
        var wrongCount = 0; // answer mistakes this question
        var guessPending = null; // {kind, value, reveal} while the guess panel is open
        var dragState = null; // active drag of the need box
        var suppressClick = false; // swallow the click that ends a drag
        // ----- guide (あそびかた) & in-play help state -----
        var guideMode = false; // the あそびかた guide is running
        var guideDoneShown = false; // the できたね！ panel is up
        var guideGuessWrong = false; // a wrong guess is open in the guide
        var guideKey = ""; // phase|sub the bubble was last synced to
        var guidePdAllow = []; // elements the guide lets the child press (pointerdown)
        var guideClickAllow = []; // elements the guide lets the child click
        var dragFailCount = 0; // failed drags of the 10, this question
        var rescueSelected = false; // tap-rescue: the 10 is tapped, partner is next
        var bubbleText = ""; // the sentence the bubble currently shows
        var pendingIntro = false; // play the invitation clip before the first guide line
        var idleTimer = null; // 5 s no-touch timer (real rounds only)
        var fingerTarget = null; // element the finger mark is pointing at
        var dragDemoRAF = null; // running drag-demo animation frame

        // element lookup for the split (only the 2-digit number splits)
        function sideEls(side) {
          return { num: el.numA, sakura: el.sakuraA, boxL: el.boxAL, boxR: el.boxAR };
        }
        function resetSide(side) {
          var s = sideEls(side);
          s.sakura.classList.remove("shown");
          clearTenGroup();
          [s.boxL, s.boxR].forEach(function (box) {
            box.classList.remove("revealed", "need", "rest", "draggable", "dragging", "tap-selected");
            box.style.transform = "";
            box.style.zIndex = "";
            box.textContent = "";
            box.disabled = false;
          });
          s.num.classList.add("tappable");
          s.num.classList.remove("opened");
          s.num.disabled = false;
        }

        function cherryRow(count, onCount, big) {
          var html = "";
          for (var i = 0; i < count; i++) html += CHERRY_SVG;
          var wrap = document.createElement("div");
          wrap.innerHTML = html;
          var nodes = wrap.querySelectorAll(".cherry");
          for (var n = 0; n < nodes.length; n++) {
            if (n < onCount) nodes[n].classList.add("on");
          }
          return wrap.innerHTML;
        }

        var GUIDE_PHASES = ["num", "boxL", "boxR", "drag", "badge", "answer"];
        function renderProgress(popLast) {
          if (guideMode) {
            // in the guide the top cherries are the progress bar:
            // one cherry colours in for each step finished
            el.progressText.innerHTML = "あそびかた";
            var done = locked
              ? GUIDE_PHASES.length
              : GUIDE_PHASES.indexOf(guidePhase());
            if (done < 0) done = 0;
            el.progressCherries.innerHTML = cherryRow(GUIDE_PHASES.length, done);
            el.progressCherries.classList.remove("many", "all");
            return;
          }
          el.progressText.innerHTML =
            "もんだい <b>" + (idx + 1) + "</b> / " + total;
          el.progressCherries.innerHTML = cherryRow(total, results.length);
          el.progressCherries.classList.toggle("many", total > 10);
          el.progressCherries.classList.toggle("all", total >= POOL.length);
          if (popLast && results.length > 0) {
            var last = el.progressCherries.querySelectorAll(".cherry")[results.length - 1];
            if (last) last.classList.add("pop");
          }
        }

        function setHint(html) { el.hint.innerHTML = html; }

        // ----- counting blocks, mirroring the sakuranbo steps -----
        var tenCubes = [];
        var onesCubes = [];
        function buildBlocks() {
          el.blocksFlow.innerHTML = "";
          tenCubes = [];
          onesCubes = [];
          var i, c;
          // two fixed rows: the 10-row always on top and the ones-row
          // always below, so the ones can never flow up into the
          // 10-row when the taken cubes shrink away
          var tenRow = document.createElement("div");
          tenRow.className = "blocks-row blocks-row-ten";
          var onesRow = document.createElement("div");
          onesRow.className = "blocks-row blocks-row-ones";
          for (i = 0; i < 10; i++) {
            c = document.createElement("div");
            c.className = "block-cube is-ten";
            tenRow.appendChild(c);
            tenCubes.push(c);
          }
          for (i = 0; i < cur.ones; i++) {
            c = document.createElement("div");
            c.className = "block-cube is-ones";
            onesRow.appendChild(c);
            onesCubes.push(c);
          }
          el.blocksFlow.appendChild(tenRow);
          el.blocksFlow.appendChild(onesRow);
          renderBlocks();
        }

        function renderBlocks() {
          if (!cur) return;
          var joined = grouped && badgeRevealed;
          el.blocksPanel.classList.toggle("is-split", !!openSide);
          el.blocksPanel.classList.toggle("is-grouped", grouped);
          el.blocksPanel.classList.toggle("is-joined", joined);
          el.blocksPanel.classList.toggle("is-done", locked);
          tenCubes.forEach(function (cube, i) {
            // the b cubes at the right end of the 10 are the ones taken away
            var taken = grouped && i >= 10 - cur.b;
            cube.classList.toggle("hl-ten", revealedL && !joined);
            cube.classList.toggle("taken", taken && !badgeRevealed);
            cube.classList.toggle("gone", taken && badgeRevealed);
            cube.classList.toggle("final", joined && !taken);
          });
          onesCubes.forEach(function (cube) {
            cube.classList.toggle("hl-ones", revealedR && !joined);
            cube.classList.toggle("final", joined);
          });
          if (locked) {
            el.blocksCaption.innerHTML =
              "こたえは <span class='hl'>" + cur.ans + "</span> こ！";
          } else if (joined) {
            // the total stays hidden behind ⬜︎ until the answer is picked
            el.blocksCaption.innerHTML =
              "<span class='hl'>" + cur.diff + "</span>と" +
              "<span class='hl-b'>" + cur.ones + "</span>で⬜︎。";
          } else if (grouped) {
            el.blocksCaption.innerHTML =
              "10ひく<span class='hl'>" + cur.b + "</span>は・・・？";
          } else if (openSide) {
            // each ⬜︎ turns into its number only while the matching
            // sakuranbo box is revealed, and back to ⬜︎ when hidden
            var leftPart = revealedL ? "<span class='hl'>10</span>" : "⬜︎";
            var rightPart = revealedR
              ? "<span class='hl-b'>" + cur.ones + "</span>"
              : "⬜︎";
            el.blocksCaption.innerHTML =
              cur.a + "を" + leftPart + "と" + rightPart + "にわける。";
          } else {
            el.blocksCaption.textContent = "ブロックは ぜんぶで " + cur.a + " こ。";
          }
        }

        function loadQuestion() {
          var q = questions[idx];
          // the textbook way: split the 2-digit number into 10 and
          // its ones digit, take the subtrahend away from the 10,
          // then add what is left of the 10 to the ones digit
          cur = {
            a: q.a,
            b: q.b,
            ans: q.a - q.b,
            ones: q.a - 10,
            diff: 10 - q.b,
          };
          openSide = null;
          revealedL = false;
          revealedR = false;
          firstTry = true;
          locked = false;
          openedEver = { L: false, R: false, badge: false };
          guessDone = { L: false, R: false, badge: false };
          guessMissed = false;
          wrongCount = 0;
          guessPending = null;
          dragFailCount = 0;
          rescueSelected = false;
          guideGuessWrong = false;
          el.guessOverlay.hidden = true;
          hideFinger();
          hideBubble();

          el.numA.textContent = q.a;
          el.numB.textContent = q.b;
          resetSide("A");
          buildBlocks();

          el.answerSlot.textContent = "？";
          el.answerSlot.classList.remove("filled");
          el.feedback.textContent = "";
          el.feedback.className = "feedback";

          var padBtns = el.pad.querySelectorAll("button");
          padBtns.forEach(function (btn) {
            btn.disabled = false;
            btn.classList.remove("wrong", "correct");
          });

          renderProgress(false);
          // thinking text only: how to operate is taught by the
          // guide, the 5-second finger and the ？ button instead
          setHint(cur.ones + " から " + cur.b + " は ひけないから。");
          armIdle();
        }

        function openSakura(side) {
          if (locked || openSide === side) return;
          sndPop();
          if (openSide) resetSide(openSide); // switch: close the other one
          openSide = side;
          revealedL = false;
          revealedR = false;
          var s = sideEls(side);
          s.num.classList.remove("tappable");
          s.num.classList.add("opened");
          s.sakura.classList.add("shown");
          renderBlocks();
          setHint("");
          afterStateChange();
        }

        // the left box always holds the 10 we subtract from: it is the
        // "need" (red) box and the one that can be dragged. The right
        // box holds the ones digit that waits its turn: the "rest" (blue)
        function boxRole(numSide, boxSide) {
          return boxSide === "L" ? "need" : "rest";
        }

        // ----- drag the 10 onto the number being subtracted -----
        function needRevealed() {
          if (!openSide) return false;
          return revealedL;
        }
        function restRevealed() {
          if (!openSide) return false;
          return revealedR;
        }
        function needBoxEl() {
          if (!openSide) return null;
          return sideEls(openSide).boxL;
        }
        function partnerNumEl() {
          if (!openSide) return null;
          return el.numB;
        }

        function clearTenGroup() {
          grouped = false;
          badgeRevealed = false;
          el.tenBadge.textContent = "";
          el.tenBadge.classList.add("empty");
          el.tenBadge.classList.remove("revealed");
          el.tenGroup.hidden = true;
          el.tenGroup.classList.remove("pop");
          renderBlocks();
        }

        // draw the slanted loop around the partner number and the need box,
        // measured from their real on-screen positions, badge under the 10 box.
        // The measurement must give the SAME answer whenever it runs:
        // centres come from getBoundingClientRect (a CSS scale is
        // centred, so a rect centre stays put even mid-animation),
        // but the SIZES come from offsetWidth / offsetHeight, which
        // report the plain layout size. Reading sizes from the rect
        // instead picked up whatever transform happened to be
        // mid-flight at that moment — the partner number still
        // shrinking back from its drop-hint scale, the dragged box
        // still settling — so every re-measure (the late timer, the
        // ResizeObserver firing when the badge was tapped, …) drew
        // the loop a little longer or shorter and it visibly
        // shifted around the two numbers it encloses
        function positionTenGroup() {
          var partner = partnerNumEl();
          var box = needBoxEl();
          if (!partner || !box) return;
          var stageRect = el.stage.getBoundingClientRect();
          var pr = partner.getBoundingClientRect();
          var br = box.getBoundingClientRect();
          var pw = partner.offsetWidth;
          var ph = partner.offsetHeight;
          var bw = box.offsetWidth;
          var bh = box.offsetHeight;
          var x1 = pr.left + pr.width / 2 - stageRect.left;
          var y1 = pr.top + pr.height / 2 - stageRect.top;
          var x2 = br.left + br.width / 2 - stageRect.left;
          var y2 = br.top + br.height / 2 - stageRect.top;
          var dx = x2 - x1;
          var dy = y2 - y1;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var angle = Math.atan2(dy, dx);
          var mx = (x1 + x2) / 2;
          var my = (y1 + y2) / 2;
          var loopH = Math.max(ph * 0.82, bh + 24);
          var loopW = dist + Math.max(pw, bw) * 0.8 + 38;
          el.tenLoop.style.width = loopW + "px";
          el.tenLoop.style.height = loopH + "px";
          el.tenLoop.style.left = mx + "px";
          el.tenLoop.style.top = my + "px";
          el.tenLoop.style.transform =
            "translate(-50%, -50%) rotate(" + (angle * 180) / Math.PI + "deg)";
          // badge directly under the 10 box — the badge shows what
          // is left of the 10: 10 − b, written just below the 10
          // the way the textbook writes it
          var bx = x2;
          var by = y2 + bh / 2 + 50;
          bx = Math.max(46, Math.min(stageRect.width - 46, bx));
          by = Math.max(34, by);
          el.tenBadge.style.left = bx + "px";
          el.tenBadge.style.top = by + "px";
        }

        function showTenGroup() {
          grouped = true;
          badgeRevealed = false;
          rescueSelected = false;
          var nb = needBoxEl();
          if (nb) nb.classList.remove("tap-selected");
          el.tenBadge.textContent = "";
          el.tenBadge.classList.add("empty");
          el.tenBadge.classList.remove("revealed");
          el.tenGroup.hidden = false;
          renderBlocks();
          positionTenGroup();
          el.tenGroup.classList.remove("pop");
          void el.tenGroup.offsetWidth; // restart the pop animation
          el.tenGroup.classList.add("pop");
          afterStateChange();
        }

        // ----- guess panel: before a hidden number is shown for the
        // first time in this question, the child guesses it from 3
        // big choices (the answer and two nearby numbers, 0..10).
        // A right guess reveals as "よそうが あたった"; a wrong one
        // still reveals, but the question counts as "ヒントを みた" -----
        function makeGuessChoices(correct) {
          var offsets = [-2, -1, 1, 2];
          for (var i = offsets.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = offsets[i]; offsets[i] = offsets[j]; offsets[j] = tmp;
          }
          var picks = [correct];
          for (var k = 0; k < offsets.length && picks.length < 3; k++) {
            var cand = correct + offsets[k];
            if (cand >= 0 && cand <= 10 && picks.indexOf(cand) === -1) picks.push(cand);
          }
          for (var m = picks.length - 1; m > 0; m--) {
            var n = Math.floor(Math.random() * (m + 1));
            var t2 = picks[m]; picks[m] = picks[n]; picks[n] = t2;
          }
          return picks;
        }

        function askGuess(kind, correctValue, revealFn) {
          if (guessDone[kind]) { revealFn(); return; }
          if (guessPending) return;
          guessPending = { kind: kind, value: correctValue, reveal: revealFn };
          guideGuessWrong = false;
          hideFinger();
          el.guessChoices.innerHTML = "";
          makeGuessChoices(correctValue).forEach(function (v) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = v;
            btn.setAttribute("aria-label", "よそう " + v);
            btn.addEventListener("click", function () { resolveGuess(v); });
            el.guessChoices.appendChild(btn);
          });
          el.guessOverlay.hidden = false;
          sndPop();
          if (guideMode) guideSync();
        }

        function resolveGuess(chosen) {
          if (!guessPending) return;
          var p = guessPending;
          if (guideMode && chosen !== p.value) {
            // in the guide a wrong guess is never a penalty: the
            // panel just wiggles and the finger shows the right
            // choice, and the panel stays open until it is picked
            guideGuessWrong = true;
            sndTry();
            el.guessPanel.classList.remove("shake");
            void el.guessPanel.offsetWidth;
            el.guessPanel.classList.add("shake");
            var cb = correctGuessBtn();
            if (cb) showFingerAt(cb, false);
            return;
          }
          guessPending = null;
          guessDone[p.kind] = true;
          if (chosen !== p.value) guessMissed = true;
          el.guessOverlay.hidden = true;
          p.reveal();
        }

        function doRevealBadge() {
          if (!grouped || badgeRevealed) return;
          badgeRevealed = true;
          openedEver.badge = true;
          sndPop();
          el.tenBadge.textContent = cur.diff;
          el.tenBadge.classList.remove("empty");
          el.tenBadge.classList.add("revealed");
          // restart a little pop on the number itself
          el.tenBadge.style.animation = "none";
          void el.tenBadge.offsetWidth;
          el.tenBadge.style.animation = "";
          renderBlocks();
          updateSplitHint();
          afterStateChange();
        }

        function revealBadge() {
          if (!grouped || badgeRevealed) return;
          askGuess("badge", cur.diff, doRevealBadge);
        }

        function onBoxPointerDown(numSide, boxSide, e) {
          if (locked || grouped || openSide !== numSide) return;
          if (boxRole(numSide, boxSide) !== "need") return;
          var shown = boxSide === "L" ? revealedL : revealedR;
          if (!shown) return;
          var s = sideEls(numSide);
          var box = boxSide === "L" ? s.boxL : s.boxR;
          dragState = {
            box: box,
            sakura: s.sakura,
            partner: partnerNumEl(),
            startX: e.clientX,
            startY: e.clientY,
            moved: false,
          };
          try { box.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
        }

        function onBoxPointerMove(e) {
          if (!dragState) return;
          var dx = e.clientX - dragState.startX;
          var dy = e.clientY - dragState.startY;
          if (!dragState.moved && Math.sqrt(dx * dx + dy * dy) < 12) return;
          if (!dragState.moved) {
            dragState.moved = true;
            dragState.box.classList.add("dragging");
            el.blocksPanel.classList.add("is-dragging");
            dragState.box.style.transition = "none";
            dragState.box.style.zIndex = "20";
            dragState.sakura.style.zIndex = "8";
            if (dragState.partner) dragState.partner.classList.add("drop-hint");
          }
          dragState.box.style.transform =
            "translate(" + dx + "px, " + dy + "px) scale(1.14)";
        }

        function onBoxPointerUp(e) {
          if (!dragState) return;
          var st = dragState;
          dragState = null;
          el.blocksPanel.classList.remove("is-dragging");
          if (st.partner) st.partner.classList.remove("drop-hint");
          st.sakura.style.zIndex = "";
          if (!st.moved) return;
          suppressClick = true;
          setTimeout(function () { suppressClick = false; }, 400);
          var dropped = false;
          if (st.partner) {
            var r = st.partner.getBoundingClientRect();
            dropped =
              e.clientX >= r.left - 30 && e.clientX <= r.right + 30 &&
              e.clientY >= r.top - 30 && e.clientY <= r.bottom + 30;
          }
          st.box.classList.remove("dragging");
          st.box.style.zIndex = "";
          if (dropped) {
            // Snap the box straight back into its slot with no return
            // animation, and force a reflow, BEFORE the loop is measured.
            // Measuring while the box was still animating back from the
            // drop point made the loop hug the partner number alone —
            // it only looked right after a resize re-measured it.
            st.box.style.transition = "none";
            st.box.style.transform = "";
            void st.box.offsetWidth;
            setTimeout(function () { st.box.style.transition = ""; }, 60);
            sndTen();
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                showTenGroup();
                updateSplitHint();
                // no late "corrective" re-measure: positionTenGroup
                // reads layout sizes, so the geometry it computes
                // now is already the final one and the loop does
                // not jump again a moment later
              });
            });
          } else {
            st.box.style.transition = "transform 0.16s ease";
            st.box.style.transform = "";
            setTimeout(function () { st.box.style.transition = ""; }, 200);
            // a real drag that missed: after two of these, the
            // tap-twice rescue (10 を タッチ → ひく数を タッチ)
            // takes over, in the guide and in real rounds alike
            dragFailCount++;
            afterStateChange();
          }
        }

        // the hint line carries the thinking only ("10 から 9 を
        // ひくと いくつかな？" and friends). Sentences that merely
        // tell the child what to touch were removed: the guide, the
        // 5-second finger mark and the ？ button teach operating.
        function updateSplitHint() {
          if (!openSide) return;
          if (grouped) {
            if (!badgeRevealed) {
              setHint("10 から " + cur.b + " を ひくと いくつかな？");
            } else if (restRevealed()) {
              setHint(
                "10 から " + cur.b + " を ひくと <span class='hl'>" + cur.diff + "</span>！<br>" +
                cur.diff + " と " + cur.ones + " を たすと いくつかな？"
              );
            } else {
              setHint("10 から " + cur.b + " を ひくと <span class='hl'>" + cur.diff + "</span>！");
            }
          } else if (needRevealed()) {
            setHint("10 から " + cur.b + " を ひくよ。");
          } else {
            setHint("");
          }
        }

        // tapping a box shows its number; tapping it again hides it.
        // the first show in a question goes through the guess panel
        // (see askGuess); hiding and re-showing never asks again.
        // the 10, once shown, can also be dragged onto the number
        // being subtracted (see onBoxPointerDown and friends)
        function doRevealBox(numSide, boxSide) {
          var s = sideEls(numSide);
          var isL = boxSide === "L";
          var box = isL ? s.boxL : s.boxR;
          var role = boxRole(numSide, boxSide);
          if (isL) { revealedL = true; openedEver.L = true; }
          else { revealedR = true; openedEver.R = true; }
          box.textContent = isL ? 10 : cur.ones;
          box.classList.add("revealed", role);
          if (role === "need") box.classList.add("draggable");
          renderBlocks();
          updateSplitHint();
          afterStateChange();
        }

        function toggleBox(numSide, boxSide) {
          if (suppressClick) { suppressClick = false; return; }
          if (openSide !== numSide || locked || guessPending) return;
          var s = sideEls(numSide);
          var isL = boxSide === "L";
          var box = isL ? s.boxL : s.boxR;
          var shown = isL ? revealedL : revealedR;
          var role = boxRole(numSide, boxSide);
          if (shown && isL && dragFailCount >= 2 && !grouped) {
            // tap rescue: once dragging has failed twice, tapping
            // the revealed 10 selects it instead of hiding it, and
            // tapping the number being subtracted groups them
            rescueSelected = !rescueSelected;
            box.classList.toggle("tap-selected", rescueSelected);
            box.classList.toggle("draggable", !rescueSelected);
            sndPop();
            afterStateChange();
            return;
          }
          if (shown) {
            sndPop();
            if (isL) revealedL = false; else revealedR = false;
            box.textContent = "";
            box.classList.remove("revealed", "need", "rest", "draggable");
            if (role === "need") clearTenGroup(); // the 10 falls apart with it
            renderBlocks();
            updateSplitHint();
          } else {
            askGuess(isL ? "L" : "R", isL ? 10 : cur.ones, function () {
              doRevealBox(numSide, boxSide);
            });
          }
        }

        function starBurst() {
          var burst = document.createElement("span");
          burst.className = "star-burst";
          var dirs = [
            [-70, -46], [-26, -70], [26, -70], [70, -46], [0, -84], [-52, 6], [52, 6],
          ];
          dirs.forEach(function (d) {
            var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            s.setAttribute("viewBox", "0 0 48 48");
            s.style.setProperty("--dx", d[0] + "px");
            s.style.setProperty("--dy", d[1] + "px");
            var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", STAR_PATH);
            s.appendChild(p);
            burst.appendChild(s);
          });
          el.feedback.appendChild(burst);
          setTimeout(function () { burst.remove(); }, 650);
        }

        function answer(value, btn) {
          if (locked) return;
          if (guideMode) {
            // the guide never scores, times or records anything:
            // a right answer finishes it, a wrong one just wiggles
            if (value === cur.ans) {
              locked = true;
              sndGood();
              btn.classList.add("correct");
              el.pad.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
              el.answerSlot.textContent = cur.ans;
              el.answerSlot.classList.add("filled");
              el.feedback.className = "feedback good";
              el.feedback.textContent = "せいかい！";
              starBurst();
              renderBlocks();
              renderProgress(true);
              hideFinger();
              stopDragDemo();
              hideBubble();
              setTimeout(showGuideDone, 1000);
            } else {
              sndTry();
              btn.classList.add("wrong");
              setTimeout(function () { btn.classList.remove("wrong"); }, 380);
              el.feedback.className = "feedback try";
              el.feedback.textContent = "おしい！ もういちど かんがえて みよう！";
            }
            return;
          }
          if (value === cur.ans) {
            locked = true;
            sndGood();
            btn.classList.add("correct");
            el.pad.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
            el.answerSlot.textContent = cur.ans;
            el.answerSlot.classList.add("filled");
            el.feedback.className = "feedback good";
            el.feedback.textContent = firstTry ? "せいかい！ すごい！" : "せいかい！ よく がんばったね！";
            starBurst();
            if (firstTry) score++;
            // 3-step grade: thinking points (opened nothing = 2,
            // opened but every guess right = 1, any guess wrong = 0)
            // minus 1 per answer mistake, floored at 0.
            // 2 = きん, 1 = あか, 0 = がんばった
            var anyOpened = openedEver.L || openedEver.R || openedEver.badge;
            var base = !anyOpened ? 2 : guessMissed ? 0 : 1;
            var grade = Math.max(0, base - wrongCount);
            results.push({
              a: cur.a, b: cur.b, ans: cur.ans, firstTry: firstTry, grade: grade,
              wrongs: wrongCount, hint: guessMissed,
            });
            if (results.length >= total) finishTime = Date.now();
            renderBlocks();
            renderProgress(true);
            advanceTimer = setTimeout(next, 1050);
          } else {
            firstTry = false;
            wrongCount++;
            sndTry();
            btn.classList.add("wrong");
            btn.disabled = true;
            el.feedback.className = "feedback try";
            el.feedback.textContent = "おしい！ もういちど かんがえて みよう！";
          }
        }

        function next() {
          idx++;
          if (idx < total) {
            loadQuestion();
          } else {
            showResult();
          }
        }

        // one big cherry per question, coloured by its grade:
        // きん (2) gold, あか (1) red, がんばった (0) outline only
        function gradeCherriesHTML() {
          var wrap = document.createElement("div");
          results.forEach(function (r) {
            var tmp = document.createElement("div");
            tmp.innerHTML = CHERRY_SVG;
            var node = tmp.querySelector(".cherry");
            node.classList.add(r.grade >= 2 ? "gold" : r.grade === 1 ? "red" : "outline");
            wrap.appendChild(node);
          });
          return wrap.innerHTML;
        }

        var CLOCK_SVG =
          '<svg viewBox="0 0 48 48" aria-hidden="true">' +
          '<circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="4"/>' +
          '<path d="M24 14 L24 24 L31 28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>";

        function showResult() {
          el.playScreen.hidden = true;
          el.resultScreen.hidden = false;
          el.helpBtn.hidden = true;
          hideFinger();
          hideBubble();
          if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
          el.progressText.innerHTML = "おつかれさま！";
          el.progressCherries.innerHTML = cherryRow(total, results.length);
          el.progressCherries.classList.toggle("many", total > 10);
          el.progressCherries.classList.toggle("all", total >= POOL.length);

          var gold = 0, red = 0, outline = 0;
          results.forEach(function (r) {
            if (r.grade >= 2) gold++;
            else if (r.grade === 1) red++;
            else outline++;
          });

          el.bigCherries.innerHTML = gradeCherriesHTML();
          el.bigCherries.classList.toggle("many", total > 10);
          el.bigCherries.classList.toggle("all", total >= POOL.length);

          // one short headline only
          el.resultTitle.textContent =
            gold === total ? "あたまで パーフェクト！" :
            outline === 0 ? "よく かんがえた！" : "がんばった！";

          el.countsLine.innerHTML =
            "<span class='c-gold'>きん " + gold + "こ</span>・" +
            "<span class='c-red'>あか " + red + "こ</span>・" +
            "がんばった " + outline + "こ。";

          var elapsed = finishTime && startTime ? finishTime - startTime : 0;
          el.timeLine.innerHTML = CLOCK_SVG + "<span>" + fmtTime(elapsed) + "。</span>";

          // best time counts only all-gold rounds (nothing opened,
          // no mistakes); other rounds never update it
          var allGold = total > 0 && gold === total;
          var isNewBest = false;
          if (allGold && elapsed > 0) {
            var prevBest = typeof bestTimes[total] === "number" ? bestTimes[total] : null;
            if (prevBest === null || elapsed < prevBest) {
              bestTimes[total] = elapsed;
              saveBestTimes();
              isNewBest = true;
            }
          }
          el.bestNote.textContent = isNewBest ? "★ ベストタイム！" : "";

          // next goal: one short line
          el.goalText.textContent =
            outline > 0 ? "つぎは よそうを あてよう！" :
            red > 0 ? "つぎは あけずに きんを めざそう！" :
            "つぎは もっと はやく きんを めざそう！";

          // weak problems from this round (grade がんばった): most
          // mistakes first, ties broken by "needed the hint". The
          // saved weak list is updated once per round, here at the
          // end of it, and the box shows only when there is one
          if (!weakApplied) {
            weakApplied = true;
            updateWeakFromResults();
          }
          var weakResults = results.filter(function (r) { return r.grade <= 0; });
          weakResults.sort(function (x, y) {
            if (y.wrongs !== x.wrongs) return y.wrongs - x.wrongs;
            return (y.hint ? 1 : 0) - (x.hint ? 1 : 0);
          });
          if (weakResults.length) {
            el.weakChips.innerHTML = "";
            weakResults.slice(0, 3).forEach(function (r) {
              var chip = document.createElement("span");
              chip.className = "weak-chip";
              chip.textContent = r.a + " − " + r.b;
              el.weakChips.appendChild(chip);
            });
            if (weakResults.length > 3) {
              var more = document.createElement("span");
              more.className = "weak-more";
              more.textContent = "ほか " + (weakResults.length - 3) + "もん。";
              el.weakChips.appendChild(more);
            }
            el.weakBox.hidden = false;
          } else {
            el.weakBox.hidden = true;
          }

          // detail list stays closed until asked for
          el.reviewWrap.hidden = true;
          el.detailToggle.textContent = "くわしく みる。";
          el.review.innerHTML = "";
          results.forEach(function (r) {
            var li = document.createElement("li");
            var expr = document.createElement("span");
            expr.textContent = r.a + " − " + r.b + " = " + r.ans;
            var mark = document.createElement("span");
            if (r.grade >= 2) { mark.className = "mark gold"; mark.textContent = "◎"; }
            else if (r.grade === 1) { mark.className = "mark red"; mark.textContent = "◎"; }
            else { mark.className = "mark outline"; mark.textContent = "○"; }
            li.appendChild(expr);
            li.appendChild(mark);
            el.review.appendChild(li);
          });

          if (gold / total >= 0.8) {
            sndFanfare();
            rainStars();
          } else {
            sndGood();
          }
        }

        function rainStars() {
          var colors = ["#f7b731", "#e0342b", "#2f9e4f", "#ff8a5c"];
          for (var i = 0; i < 16; i++) {
            (function (i) {
              var wrap = document.createElement("span");
              wrap.className = "fall-star";
              wrap.style.left = Math.random() * 96 + "%";
              wrap.style.animationDuration = 1.1 + Math.random() * 1.0 + "s";
              wrap.style.animationDelay = Math.random() * 0.5 + "s";
              var size = 18 + Math.random() * 20;
              var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
              s.setAttribute("viewBox", "0 0 48 48");
              s.setAttribute("width", size);
              s.setAttribute("height", size);
              var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
              p.setAttribute("d", STAR_PATH);
              p.setAttribute("fill", colors[i % colors.length]);
              s.appendChild(p);
              wrap.appendChild(s);
              el.resultScreen.appendChild(wrap);
              setTimeout(function () { wrap.remove(); }, 3000);
            })(i);
          }
        }

        function fmtTime(ms) {
          var sec = Math.max(0, Math.round(ms / 1000));
          var m = Math.floor(sec / 60);
          var s = sec % 60;
          return m > 0 ? m + "ふん " + s + "びょう" : s + "びょう";
        }

        function updateBestLabels() {
          var counts = [5, 10, 20, POOL.length];
          counts.forEach(function (c) {
            var span = document.getElementById(c === POOL.length ? "bestAll" : "best" + c);
            if (!span) return;
            if (typeof bestTimes[c] !== "number") {
              span.textContent = "まだ ない。";
              span.classList.add("none");
            } else {
              span.textContent = fmtTime(bestTimes[c]) + "。";
              span.classList.remove("none");
            }
          });
        }

        function showTitle() {
          if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
          cleanupGuideUI();
          el.playScreen.hidden = true;
          el.resultScreen.hidden = true;
          el.titleScreen.hidden = false;
          el.topbar.hidden = true;
          updateBestLabels();
        }

        function startRound(count) {
          if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
          cleanupGuideUI();
          el.helpBtn.hidden = false;
          total = count || total;
          questions = makeQuestions(total);
          idx = 0;
          score = 0;
          results = [];
          weakApplied = false;
          startTime = Date.now();
          finishTime = 0;
          el.titleScreen.hidden = true;
          el.resultScreen.hidden = true;
          el.playScreen.hidden = false;
          el.topbar.hidden = false;
          loadQuestion();
        }

        var NUM_READING = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
        function numReading(n) {
          if (n === 10) return "じゅう";
          if (n > 10 && n < 20) {
            var ones = n - 10;
            return "じゅう" + (ones > 0 ? NUM_READING[ones] : "");
          }
          return NUM_READING[n] || String(n);
        }

        // prefer a natural Japanese voice when the device has one
        var jaVoice = null;
        function pickJaVoice() {
          var all = [];
          try { all = window.speechSynthesis.getVoices() || []; } catch (e) { /* optional */ }
          var ja = [];
          for (var i = 0; i < all.length; i++) {
            var lang = (all[i].lang || "").replace(/_/g, "-").toLowerCase();
            if (lang.indexOf("ja") === 0) ja.push(all[i]);
          }
          if (!ja.length) return null;
          var nice = ["siri", "google", "premium", "enhanced"];
          for (var k = 0; k < nice.length; k++) {
            for (var j = 0; j < ja.length; j++) {
              if (ja[j].name && ja[j].name.toLowerCase().indexOf(nice[k]) !== -1) return ja[j];
            }
          }
          return ja[0];
        }
        if ("speechSynthesis" in window) {
          try {
            jaVoice = pickJaVoice();
            window.speechSynthesis.onvoiceschanged = function () { jaVoice = pickJaVoice(); };
          } catch (e) { /* speech is optional */ }
        }

        var speakAttnTimer = null;
        var lastSpeakOpts = null; // what the speaker button replays
        var clipAudio = null; // the guide clip currently playing
        var clipSeq = 0; // guards late events from a replaced clip

        function stopClip() {
          clipSeq++;
          if (clipAudio) {
            clipAudio.onended = null;
            clipAudio.onerror = null;
            try { clipAudio.pause(); } catch (e) { /* optional */ }
            clipAudio = null;
          }
        }
        function speakTTS(readText) {
          stopClip();
          try {
            if (!("speechSynthesis" in window)) {
              el.speakBtn.classList.add("attn");
              return;
            }
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(readText);
            u.lang = "ja-JP";
            if (jaVoice) u.voice = jaVoice;
            u.rate = 1.0;
            u.pitch = 1.1;
            u.onstart = function () { el.speakBtn.classList.remove("attn"); };
            u.onerror = function () { el.speakBtn.classList.add("attn"); };
            window.speechSynthesis.speak(u);
            if (speakAttnTimer) clearTimeout(speakAttnTimer);
            speakAttnTimer = setTimeout(function () {
              try {
                if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
                  el.speakBtn.classList.add("attn");
                }
              } catch (e) { /* speech is optional */ }
            }, 450);
          } catch (e) {
            el.speakBtn.classList.add("attn");
          }
        }
        // play one pre-recorded clip; if it cannot play, fall back
        // to reading the sentence with the device voice instead
        function playClip(key, readText, onEnded) {
          var seq = ++clipSeq;
          try {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          } catch (e) { /* speech is optional */ }
          if (clipAudio) {
            clipAudio.onended = null;
            clipAudio.onerror = null;
            try { clipAudio.pause(); } catch (e) { /* optional */ }
            clipAudio = null;
          }
          var a = new Audio();
          clipAudio = a;
          var fellBack = false;
          function fallback() {
            if (fellBack || seq !== clipSeq) return;
            fellBack = true;
            if (clipAudio === a) clipAudio = null;
            if (readText) speakTTS(readText);
            else if (onEnded) onEnded();
          }
          a.onerror = fallback;
          a.onended = function () {
            if (seq !== clipSeq) return;
            if (clipAudio === a) clipAudio = null;
            el.speakBtn.classList.remove("attn");
            if (onEnded) onEnded();
          };
          a.src = GUIDE_AUDIO[key];
          var p = null;
          try { p = a.play(); } catch (e) { fallback(); return; }
          if (p && typeof p.catch === "function") {
            p.then(function () {
              if (seq === clipSeq) el.speakBtn.classList.remove("attn");
            }).catch(fallback);
          }
        }
        // opts: { read: reading sentence, clip: GUIDE_AUDIO key,

        function speak(text, opts) {
          if (!text) return;
          bubbleText = text;
          opts = opts || {};
          lastSpeakOpts = opts;
          var readText = opts.read || text;
          var hasClip = opts.clip && typeof GUIDE_AUDIO !== "undefined" && !!GUIDE_AUDIO[opts.clip];
          if (opts.intro && typeof GUIDE_AUDIO !== "undefined" && GUIDE_AUDIO.hajime) {
            // guide opening: the invitation clip first, then the line
            playClip("hajime", null, function () {
              if (hasClip) playClip(opts.clip, readText);

          }
          if (hasClip) playClip(opts.clip, readText);
          else speakTTS(readText);

        function showFingerAt(target, soft) {

        // ----- drag demo: the finger traces a dotted path from
        // the 10 box to the number being subtracted, over and over -----
        function updateDragPath() {
          var sr = el.stage.getBoundingClientRect();
          var br = el.boxAL.getBoundingClientRect();
          var nr = el.numB.getBoundingClientRect();
          el.dragLine.setAttribute("x1", br.left + br.width / 2 - sr.left);
          el.dragLine.setAttribute("y1", br.top + br.height / 2 - sr.top);
          el.dragLine.setAttribute("x2", nr.left + nr.width / 2 - sr.left);
          el.dragLine.setAttribute("y2", nr.top + nr.height / 2 - sr.top);
        }
        function startDragDemo() {
          if (dragDemoRAF) return;
          updateDragPath();
          el.dragPath.hidden = false;
          el.finger.classList.remove("soft");
          el.finger.hidden = false;
          fingerTarget = null;
          var t0 = null;
          function frame(ts) {
            if (!guideMode) { dragDemoRAF = null; return; }
            if (!t0) t0 = ts;
            var t = ((ts - t0) % 1750) / 1250;
            if (t > 1) t = 1;
            var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            var br = el.boxAL.getBoundingClientRect();
            var nr = el.numB.getBoundingClientRect();
            var x1 = br.left + br.width / 2, y1 = br.bottom;
            var x2 = nr.left + nr.width / 2, y2 = nr.bottom;
            el.finger.style.left = x1 + (x2 - x1) * e + "px";

          }

        function guidePhase() {

          if (phase === "num") return "かずを タッチしてね！";
          if (phase === "boxL") return "しかくを タッチして、かずを あててね！";
          if (phase === "boxR") return "もう ひとつの しかくを タッチして、かずを あててね！";
          if (phase === "drag") {
            return sub === "drag"
              ? "あかい 10を うごかして、" + cur.b + "に あわせてね！"
              : "10を タッチして、つぎに " + cur.b + "を タッチしてね！";
          }
          if (phase === "badge") return "まるを タッチして、かずを あててね！";
          return "こたえを タッチしてね！";
        }
        // the same one-sentence instruction, for real rounds (？ button)
        function stepInstruction() {
          if (!cur) return "";
          if (!openSide) return "かずを タッチしてね！";
          if (grouped) {
            if (!badgeRevealed) return "まるを タッチして、かずを あててね！";
            if (!revealedR) return "もう ひとつの しかくを タッチして、かずを あててね！";
            return "こたえを タッチしてね！";
          }
          if (!revealedL) return "しかくを タッチして、かずを あててね！";
          if (dragFailCount >= 2) return "10を タッチして、つぎに " + cur.b + "を タッチしてね！";
          return "あかい 10を うごかして、" + cur.b + "に あわせてね！";
        }
        // reading-aloud sentences for the instructions above:
        // kanji/kana mix with numbers spelled out, so the device
        // voice reads them naturally. The display text stays
        // hiragana; only the voice hears these.
        function guideReading(phase, sub) {
          if (phase === "num") return "数をタッチしてね！";
          if (phase === "boxL") return "四角をタッチして、数を当ててね！";
          if (phase === "boxR") return "もう一つの四角をタッチして、数を当ててね！";
          if (phase === "drag") {
            return sub === "drag"
              ? "赤いじゅうを動かして、" + numReading(cur.b) + "に合わせてね！"
              : "じゅうをタッチして、次に" + numReading(cur.b) + "をタッチしてね！";
          }
          if (phase === "badge") return "丸をタッチして、数を当ててね！";
          return "答えをタッチしてね！";
        }
        // which pre-recorded clip matches this guide step, if any
        // (matched by meaning, not by the display string)
        function guideClipKey(phase, sub) {
          if (phase === "num") return "kazu";
          if (phase === "boxL") return "shikaku";
          if (phase === "boxR") return "mouhitotsu";
          if (phase === "drag") return sub === "drag" ? "drag" : "taptap";
          if (phase === "badge") return "maru";
          if (phase === "answer") return "kotae";
          return null;
        }
        function stepReading() {
          if (!cur) return "";
          if (!openSide) return "数をタッチしてね！";
          if (grouped) {
            if (!badgeRevealed) return "丸をタッチして、数を当ててね！";
            if (!revealedR) return "もう一つの四角をタッチして、数を当ててね！";
            return "答えをタッチしてね！";
          }
          if (!revealedL) return "四角をタッチして、数を当ててね！";
          if (dragFailCount >= 2) {
            return "じゅうをタッチして、次に" + numReading(cur.b) + "をタッチしてね！";
          }
          return "赤いじゅうを動かして、" + numReading(cur.b) + "に合わせてね！";
        }
        // where the finger should point in a real round right now
        function currentTargetEl() {
          if (!cur || locked || guessPending) return null;
          if (!openSide) return el.numA;
          if (grouped) {
            if (!badgeRevealed) return el.tenBadge;
            if (!revealedR) return el.boxAR;
            return el.pad;
          }
          if (!revealedL) return el.boxAL;
          if (dragFailCount >= 2 && !rescueSelected) return el.boxAL;
          if (dragFailCount >= 2 && rescueSelected) return el.numB;
          return el.boxAL; // the drag target
        }
        function guessBtns() {
          return Array.prototype.slice.call(el.guessChoices.querySelectorAll("button"));
        }
        function correctGuessBtn() {
          if (!guessPending) return null;
          var btns = guessBtns();
          for (var i = 0; i < btns.length; i++) {
            if (parseInt(btns[i].textContent, 10) === guessPending.value) return btns[i];
          }
          return null;
        }

        // ----- guide sync: bubble, voice, gate and finger follow
        // the real step transitions of the question on screen -----
        function clearGlows() {
          [el.numA, el.boxAL, el.boxAR, el.tenBadge, el.pad, el.numB].forEach(function (n) {
            n.classList.remove("guide-glow");
          });
        }
        function setGuideTargets(phase, sub) {
          var pd = [], ck = [], glow = null;
          if (guessPending) {
            pd = guessBtns(); ck = pd.slice();
          } else if (phase === "num") {
            pd = [el.numA]; ck = [el.numA]; glow = el.numA;
          } else if (phase === "boxL") {
            pd = [el.boxAL]; ck = [el.boxAL]; glow = el.boxAL;
          } else if (phase === "boxR") {
            pd = [el.boxAR]; ck = [el.boxAR]; glow = el.boxAR;
          } else if (phase === "drag") {
            if (sub === "drag") { pd = [el.boxAL]; ck = []; glow = el.boxAL; }
            else if (sub === "tap2") { pd = [el.numB]; ck = [el.numB]; glow = el.numB; }
            else { pd = [el.boxAL]; ck = [el.boxAL]; glow = el.boxAL; }
          } else if (phase === "badge") {
            pd = [el.tenBadge]; ck = [el.tenBadge]; glow = el.tenBadge;
          } else if (phase === "answer") {
            pd = Array.prototype.slice.call(el.pad.querySelectorAll("button"));
            ck = pd.slice();
            glow = el.pad;
          }
          guidePdAllow = pd;
          guideClickAllow = ck;
          clearGlows();
          if (glow && !guessPending) glow.classList.add("guide-glow");
        }
        function updateGuidePointer(phase, sub) {
          if (guessPending) {
            stopDragDemo();
            if (guideGuessWrong) {
              var cb = correctGuessBtn();
              if (cb) { showFingerAt(cb, false); return; }
            }
            hideFinger();
            return;
          }
          if (phase === "drag" && sub === "drag") { startDragDemo(); return; }
          stopDragDemo();
          var t = null;
          if (phase === "num") t = el.numA;
          else if (phase === "boxL") t = el.boxAL;
          else if (phase === "boxR") t = el.boxAR;
          else if (phase === "drag") t = sub === "tap2" ? el.numB : el.boxAL;
          else if (phase === "badge") t = el.tenBadge;
          else if (phase === "answer") t = el.pad;
          if (t) showFingerAt(t, false);
          else hideFinger();
        }
        function guideSync(force) {
          if (!guideMode || guideDoneShown) return;
          var phase = guidePhase();
          var sub = guessPending
            ? "guess"
            : phase === "drag"
              ? dragFailCount >= 2
                ? rescueSelected ? "tap2" : "tap1"
                : "drag"
              : "";
          setGuideTargets(phase, sub);
          // opening the guess panel is part of the same step, so
          // it does not re-read the same sentence
          var key = phase + "|" + (sub === "guess" ? "" : sub);
          if (force || key !== guideKey) {
            guideKey = key;
            var text = guideInstruction(phase, sub);
            showBubble(text);
            var opts = { read: guideReading(phase, sub), clip: guideClipKey(phase, sub) };
            if (pendingIntro) { opts.intro = true; pendingIntro = false; }
            speak(text, opts);
            renderProgress(false);
          }
          updateGuidePointer(phase, sub);
        }
        function afterStateChange() {
          if (guideMode) guideSync();
          armIdle();
        }

        // ----- guide start / finish -----
        function cleanupGuideUI() {
          guideMode = false;
          guideDoneShown = false;
          guideGuessWrong = false;
          guideKey = "";
          pendingIntro = false;
          guidePdAllow = [];
          guideClickAllow = [];
          rescueSelected = false;
          document.body.classList.remove("guide-on");
          el.guideDone.hidden = true;
          el.quitBtn.hidden = true;
          clearGlows();
          stopDragDemo();
          hideFinger();
          hideBubble();
        }
        function startGuide() {
          cleanupGuideUI();
          guideMode = true;
          document.body.classList.add("guide-on");
          // one fixed example, solved on the real play screen.
          // No timer, no score, no results: the weak list, the
          // deck and the best times are never touched.
          questions = [{ a: 12, b: 9 }];
          total = 1;
          idx = 0;
          results = [];
          score = 0;
          el.titleScreen.hidden = true;
          el.resultScreen.hidden = true;
          el.playScreen.hidden = false;
          el.topbar.hidden = false;
          el.quitBtn.hidden = false;
          el.helpBtn.hidden = true;
          loadQuestion();
          pendingIntro = true;
          guideSync(true);
        }
        function showGuideDone() {
          if (!guideMode) return;
          guideDoneShown = true;
          hideFinger();
          stopDragDemo();
          clearGlows();
          el.guideDone.hidden = false;
          sndFanfare();
          speak("できたね！", { read: "できたね！", clip: "dekitane" });
        }
        function endGuide() {
          cleanupGuideUI();
          showTitle();
        }

        // ----- the guide gate: while guiding, only the current
        // target (and やめる / the speaker) can be pressed -----
        function guideGate(e) {
          if (!guideMode) return;
          var t = e.target;
          if (t && t.closest) {
            if (t.closest("#guideBubble") || t.closest("#quitBtn")) return;
            if (!el.guideDone.hidden) {
              if (t.closest("#guideDone")) return;
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              return;
            }
          }
          var allow = e.type === "click" ? guideClickAllow : guidePdAllow;
          for (var i = 0; i < allow.length; i++) {
            if (allow[i] === t || (allow[i].contains && allow[i].contains(t))) return;
          }
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          flashFinger();
        }
        document.addEventListener("pointerdown", guideGate, true);
        document.addEventListener("click", guideGate, true);

        // ----- real rounds: after 5 s with no touch at all, a
        // soft finger mark appears where the next touch goes.
        // Any touch hides it and restarts the count. Never while
        // the guess panel is open (it would give the answer away) -----
        function armIdle() {
          if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
          if (guideMode || el.playScreen.hidden || locked) return;
          idleTimer = setTimeout(function () {
            idleTimer = null;
            if (guideMode || el.playScreen.hidden || locked || guessPending) return;
            if (dragState) { armIdle(); return; }
            var t = currentTargetEl();
            if (t) showFingerAt(t, true);
          }, 5000);
        }
        document.addEventListener("pointerdown", function (e) {
          if (guideMode || el.playScreen.hidden) return;
          hideFinger();
          var t = e.target;
          if (!t || !t.closest || (!t.closest("#guideBubble") && !t.closest("#helpBtn"))) {
            hideBubble();
          }
          armIdle();
        }, true);

        // ----- new buttons -----
        el.guideBtn.addEventListener("click", function () { sndPop(); startGuide(); });
        el.quitBtn.addEventListener("click", function () { sndPop(); endGuide(); });
        el.donePlayBtn.addEventListener("click", function () { sndPop(); endGuide(); });
        el.doneTitleBtn.addEventListener("click", function () { sndPop(); endGuide(); });
        el.doneAgainBtn.addEventListener("click", function () { sndPop(); startGuide(); });
        el.helpBtn.addEventListener("click", function () {
          var text = stepInstruction();
          if (!text) return;
          showBubble(text);
          speak(text, { read: stepReading() });
        });
        el.speakBtn.addEventListener("click", function () {
          el.speakBtn.classList.remove("attn");
          speak(bubbleText, lastSpeakOpts);
        });
        // tap rescue, second tap: the number being subtracted
        el.numB.addEventListener("click", function () {
          if (locked || grouped || !openSide || !rescueSelected) return;
          rescueSelected = false;
          var box = needBoxEl();
          if (box) box.classList.remove("tap-selected");
          sndTen();
          showTenGroup();
          updateSplitHint();
        });
        window.addEventListener("resize", function () {
          if (dragDemoRAF) updateDragPath();
          else if (!el.finger.hidden && fingerTarget) {
            showFingerAt(fingerTarget, el.finger.classList.contains("soft"));
          }
        });

        // ----- build answer pad 2..9 -----
        for (var v = 2; v <= 9; v++) {
          (function (value) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = value;
            btn.setAttribute("aria-label", "こたえ " + value);
            btn.addEventListener("click", function () { answer(value, btn); });
            el.pad.appendChild(btn);
          })(v);
        }

        el.numA.addEventListener("click", function () { openSakura("A"); });
        el.tenBadge.addEventListener("click", function () { revealBadge(); });
        el.boxAL.addEventListener("click", function () { toggleBox("A", "L"); });
        el.boxAR.addEventListener("click", function () { toggleBox("A", "R"); });
        [["A", "L", el.boxAL], ["A", "R", el.boxAR]]
          .forEach(function (cfg) {
            cfg[2].addEventListener("pointerdown", function (e) {
              onBoxPointerDown(cfg[0], cfg[1], e);
            });
            cfg[2].addEventListener("pointermove", onBoxPointerMove);
            cfg[2].addEventListener("pointerup", onBoxPointerUp);
            cfg[2].addEventListener("pointercancel", onBoxPointerUp);
          });
        window.addEventListener("resize", function () {
          if (grouped) positionTenGroup();
        });
        window.addEventListener("orientationchange", function () {
          if (grouped) {
            setTimeout(function () { if (grouped) positionTenGroup(); }, 120);
          }
        });
        // layout can also shift without a window resize (side panel
        // opening, web font arriving, hint wrapping): re-measure then too
        if ("ResizeObserver" in window) {
          var tenRO = new ResizeObserver(function () {
            if (grouped) positionTenGroup();
          });
          tenRO.observe(el.stage);
          tenRO.observe(el.equation);
        }
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            if (grouped) positionTenGroup();
          });
        }
        el.detailToggle.addEventListener("click", function () {
          sndPop();
          var open = el.reviewWrap.hidden;
          el.reviewWrap.hidden = !open;
          el.detailToggle.textContent = open ? "とじる。" : "くわしく みる。";
        });
        el.againBtn.addEventListener("click", function () { sndPop(); startRound(total); });
        el.titleBtn.addEventListener("click", function () { sndPop(); showTitle(); });
        document.querySelectorAll(".count-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var c = btn.getAttribute("data-count");
            startRound(c === "all" ? POOL.length : parseInt(c, 10));
          });
        });

        // the ぜんぶ button shows the real pool size, and the colour
        // legend in the result detail gets its little cherries
        el.allCountSub.textContent = POOL.length + "もん。";
        document.querySelectorAll(".mini-cherry").forEach(function (span) {
          span.innerHTML = CHERRY_SVG;
          var node = span.querySelector(".cherry");
          if (node) node.classList.add(span.getAttribute("data-grade"));
        });

        el.titleCherries.innerHTML = cherryRow(2, 2, true);
        el.guideDoneCherries.innerHTML = cherryRow(2, 2, true);
        showTitle();
      })();
    </script>
  </body>
</html>
