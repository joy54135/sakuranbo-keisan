<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さくらんぼ けいさん｜かずの あそびば</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(180deg, #ffe3ee 0%, #fff6e9 55%, #e8f7ff 100%);
    color: #5b3040;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 20px 44px;
    position: relative;
  }

  /* うかぶ かざり */
  .deco {
    position: absolute;
    pointer-events: none;
    animation: floaty 5s ease-in-out infinite;
    opacity: 0.9;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-16px) rotate(6deg); }
  }

  .cherry {
    font-size: 74px;
    line-height: 1.1;
    animation: bounce 1.6s ease-in-out infinite;
    filter: drop-shadow(0 6px 0 rgba(255, 93, 143, 0.25));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-14px) scale(1.04); }
    55% { transform: translateY(0) scale(0.97); }
    70% { transform: translateY(-6px) scale(1.01); }
  }

  h1 {
    font-size: clamp(34px, 8.5vw, 52px);
    font-weight: 900;
    letter-spacing: 0.05em;
    margin: 8px 0 4px;
    color: #e8375f;
    text-shadow: 0 3px 0 #ffd3dd, 0 6px 14px rgba(232, 55, 95, 0.18);
    text-align: center;
  }
  .sub {
    font-size: clamp(17px, 4.6vw, 22px);
    font-weight: 700;
    color: #ff8c42;
    letter-spacing: 0.14em;
    margin-bottom: 10px;
  }
  .lead {
    font-size: clamp(17px, 4.4vw, 21px);
    font-weight: 700;
    color: #7a4a54;
    text-align: center;
    line-height: 1.7;
    margin-bottom: 30px;
  }
  .lead .big { color: #e8375f; font-size: 1.15em; }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
    max-width: 460px;
  }
  a.card {
    display: block;
    text-decoration: none;
    background: #ffffff;
    border-radius: 28px;
    padding: 24px 24px 26px;
    animation: popin 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  a.card:nth-child(2) { animation-delay: 0.12s; }
  @keyframes popin {
    from { transform: scale(0.85) translateY(16px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  a.card.tasizan {
    border: 4px solid #ff8fab;
    box-shadow: 0 8px 0 #ffc2d1;
    transform: rotate(-1.2deg);
  }
  a.card.hikizan {
    border: 4px solid #6ec3ff;
    box-shadow: 0 8px 0 #bde3ff;
    transform: rotate(1.2deg);
  }
  a.card:active { transform: translateY(5px) rotate(0deg); }
  a.card.tasizan:active { box-shadow: 0 3px 0 #ffc2d1; }
  a.card.hikizan:active { box-shadow: 0 3px 0 #bde3ff; }

  .card .name {
    font-size: clamp(25px, 6.4vw, 32px);
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tasizan .name { color: #e8375f; }
  .hikizan .name { color: #1b87d8; }
  .card .desc {
    margin-top: 10px;
    font-size: clamp(16px, 4.2vw, 19px);
    font-weight: 700;
    color: #6d4750;
    line-height: 1.75;
  }
  .card .go {
    margin-top: 16px;
    display: inline-block;
    color: #fff;
    font-weight: 900;
    font-size: clamp(19px, 5vw, 23px);
    letter-spacing: 0.08em;
    padding: 12px 34px;
    border-radius: 999px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .tasizan .go { background: linear-gradient(180deg, #ff7aa2, #ff4d7e); box-shadow: 0 5px 0 #d6336c; }
  .hikizan .go { background: linear-gradient(180deg, #5db9ff, #2f9df0); box-shadow: 0 5px 0 #1b6fb8; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }

  footer {
    margin-top: 38px;
    font-size: clamp(14px, 3.6vw, 16px);
    font-weight: 700;
    color: #b07f8e;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <span class="deco" style="top: 4%; left: 5%; font-size: 34px; animation-delay: 0s;">⭐</span>
  <span class="deco" style="top: 9%; right: 6%; font-size: 38px; animation-delay: 0.8s;">🎈</span>
  <span class="deco" style="top: 34%; left: 2%; font-size: 28px; animation-delay: 1.6s;">🌸</span>
  <span class="deco" style="top: 40%; right: 3%; font-size: 30px; animation-delay: 0.4s;">🍒</span>
  <span class="deco" style="top: 66%; left: 4%; font-size: 30px; animation-delay: 1.1s;">🎈</span>
  <span class="deco" style="top: 72%; right: 5%; font-size: 32px; animation-delay: 2s;">⭐</span>

  <div class="cherry">🍒</div>
  <h1>さくらんぼ けいさん</h1>
  <div class="sub">★ かずの あそびば ★</div>
  <p class="lead">どっちで あそびたい？<br><span class="big">タッチして スタート！</span></p>

  <div class="cards">
    <a class="card tasizan" href="tasizan/">
      <div class="name">🍒 たしざん</div>
      <p class="desc">9＋3など<br>こたえが 10より おおきくなる たしざん</p>
      <span class="go">▶ あそぶ！</span>
    </a>

    <a class="card hikizan" href="hikizan/">
      <div class="name">🍒 ひきざん</div>
      <p class="desc">12−3など<br>10より おおきい かずから ひく ひきざん</p>
      <span class="go">▶ あそぶ！</span>
    </a>
  </div>

  <footer>タブレットや スマホで あそべるよ！<br>まいにち すこしずつ がんばろう ⭐</footer>
</body>
</html>
